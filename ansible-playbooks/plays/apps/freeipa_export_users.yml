# Exports FreeIPA users (identity attributes + group memberships) to a
# portable JSON file for freeipa_import_users.yml in another realm.
# Passwords can't come along (Kerberos keys are realm-specific and never
# exposed), and uid/gid numbers are left for the target to assign.
# freeipa_export_fields is an allow-list: IPA's full output is mostly
# realm-internal state.
#
# Uses the JSON-RPC API directly since no module lists users.
#
#   ansible-playbook --ask-vault-pass -i inventory/<env> \
#     plays/apps/freeipa_export_users.yml -e freeipa_export_file=/path/to/users.json
#
# The default path is under the gitignored inventory/. The file is PII.
- name: Export FreeIPA user accounts to a portable file
  hosts: freeipa
  become: false
  gather_facts: false

  vars:
    freeipa_export_file: "{{ inventory_dir }}/freeipa-users-export.json"
    freeipa_export_fields:
      - uid
      - givenname
      - sn
      - cn
      - mail
      - title
      - gecos
      - homedirectory
      - loginshell
      - ipasshpubkey
      - memberof_group

  tasks:
    - name: Log in to FreeIPA's JSON-RPC API as admin
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}.{{ base_domain }}/ipa/session/login_password"
        method: POST
        body_format: form-urlencoded
        body:
          user: admin
          password: "{{ freeipa_admin_password }}"
        headers:
          Referer: "https://{{ inventory_hostname }}.{{ base_domain }}/ipa"
        status_code: 200
      register: freeipa_login
      no_log: true

    - name: Fetch every user account's full attribute set
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}.{{ base_domain }}/ipa/session/json"
        method: POST
        headers:
          Referer: "https://{{ inventory_hostname }}.{{ base_domain }}/ipa"
          Content-Type: application/json
          Accept: application/json
          Cookie: "{{ freeipa_login.cookies_string }}"
        body_format: json
        body:
          method: user_find
          params:
            - [""]
            - all: true
              sizelimit: 0
        status_code: 200
      register: freeipa_user_find

    - name: Filter each user down to the portable attribute set
      ansible.builtin.set_fact:
        freeipa_export_users: "{{ freeipa_export_users | default([]) + [item | dict2items | selectattr('key', 'in', freeipa_export_fields) | items2dict] }}"
      loop: "{{ freeipa_user_find.json.result.result }}"
      loop_control:
        label: "{{ item.uid[0] | default('?') }}"

    - name: Write the portable export file
      ansible.builtin.copy:
        content: "{{ freeipa_export_document | to_nice_json }}\n"
        dest: "{{ freeipa_export_file }}"
      delegate_to: localhost
      vars:
        freeipa_export_document:
          exported_from_realm: "{{ freeipa_realm }}"
          exported_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          users: "{{ freeipa_export_users | default([]) }}"

    - name: Report what was exported
      ansible.builtin.debug:
        msg: >-
          Exported {{ freeipa_export_users | default([]) | length }}
          user(s) from {{ freeipa_realm }} to {{ freeipa_export_file }}.
