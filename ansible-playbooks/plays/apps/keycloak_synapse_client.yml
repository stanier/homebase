---
# Registers Synapse (container-files/matrix) as an OIDC client in
# Keycloak, so Matrix logins go through Keycloak's existing FreeIPA LDAP
# federation (see keycloak_ldap_federation.yml) -- same shape as
# keycloak_vaultwarden_client.yml. Synapse does have an LDAP auth module,
# but OIDC keeps FreeIPA's bind credentials out of yet another service.
#
# Runs after plays/apps/podman.yml against Keycloak's own admin REST API.
#
# The client secret is vault-supplied (keycloak_synapse_client_secret),
# not left for Keycloak to generate, so Synapse's own homeserver.yaml
# (host_vars/chat1.yml) can template the same value in one pass.
#
# No back-channel logout (yet): Keycloak would call it through
# container-sandbox's Caddy, whose cert chains to the fleet root CA --
# and keycloak/server.container's KC_TRUSTSTORE_PATHS only adds
# FreeIPA's CA, so that call would fail TLS. Add the root CA there first,
# then set backchannel.logout.url (a raw client attribute -- the
# module's backchannel_logout_url option needs community.general 12.4.0,
# and requirements.yml pins >=11.2.1) plus backchannel_logout_enabled
# in homeserver.yaml.
- name: Register Synapse as a Keycloak OIDC client, federated via FreeIPA
  hosts: keycloak
  become: false
  gather_facts: false

  tasks:
    - name: Wait for Keycloak's API to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/realms/master
        status_code: 200
      register: keycloak_ready
      until: keycloak_ready.status | default(0) == 200
      retries: 30
      delay: 5

    - name: Add/update the Synapse OIDC client
      community.general.keycloak_client:
        auth_keycloak_url: http://127.0.0.1:8080
        auth_realm: master
        auth_username: admin
        auth_password: "{{ keycloak_bootstrap_password }}"
        realm: master
        client_id: synapse
        name: Matrix (Synapse)
        state: present
        enabled: true
        public_client: false
        protocol: openid-connect
        standard_flow_enabled: true
        direct_access_grants_enabled: false
        implicit_flow_enabled: false
        service_accounts_enabled: false
        frontchannel_logout: false
        secret: "{{ keycloak_synapse_client_secret }}"
        redirect_uris:
          - "https://chat.{{ base_domain }}/_synapse/client/oidc/callback"
        web_origins:
          - "https://chat.{{ base_domain }}"
      register: keycloak_synapse_client_result
      until: keycloak_synapse_client_result is succeeded
      retries: 3
      delay: 10
      no_log: true
