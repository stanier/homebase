---
# Plan 3: points Keycloak's LDAP User Federation at FreeIPA. This talks
# to Keycloak's own admin REST API (not a config file), so it runs as a
# separate play from plays/apps/podman.yml rather than a
# containerapps_secret_files template -- there's no file for this on
# disk to template in the first place.
#
# Requires roles/freeipa's bind-account task and CA-cert fetch to have
# already run at least once (freeipa_keycloak_bind_password's account
# needs to exist, and group_vars/files/freeipa-ca.crt needs to exist for
# server.container's KC_TRUSTSTORE_PATHS mount -- see that file's own
# comment), and plays/apps/podman.yml to have deployed keycloak with
# that mount in place, before this can succeed.
- name: Configure Keycloak's LDAP User Federation against FreeIPA
  hosts: keycloak
  become: false
  gather_facts: false

  tasks:
    # This play runs immediately after plays/apps/podman.yml, which may
    # have just (re)started keycloak's container -- Quarkus startup plus
    # any pending DB migration easily takes longer than an instant, and
    # the admin API port can accept a TCP connection before the app is
    # actually ready to answer it (hence "Connection reset by peer"
    # rather than a plain refused/timeout on the federation call below
    # if this wait is skipped). /realms/master is public/unauthenticated
    # and only starts responding once Keycloak is fully up.
    - name: Wait for Keycloak's API to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/realms/master
        status_code: 200
      register: keycloak_ready
      until: keycloak_ready.status | default(0) == 200
      retries: 30
      delay: 5

    - name: Add/update the FreeIPA LDAP user federation provider
      community.general.keycloak_user_federation:
        auth_keycloak_url: http://127.0.0.1:8080
        auth_realm: master
        auth_username: admin
        auth_password: "{{ keycloak_bootstrap_password }}"
        realm: master
        name: freeipa
        state: present
        provider_id: ldap
        provider_type: org.keycloak.storage.UserStorageProvider
        config:
          priority: 0
          enabled: true
          cachePolicy: DEFAULT
          editMode: READ_ONLY
          importEnabled: true
          syncRegistrations: false
          vendor: other
          usernameLDAPAttribute: uid
          rdnLDAPAttribute: uid
          # ipaUniqueID, not entryUUID (OpenLDAP) or nsUniqueId (raw
          # 389-ds) -- FreeIPA's own stable per-object identifier,
          # present on every user entry via the ipaobject class.
          uuidLDAPAttribute: ipaUniqueID
          userObjectClasses: "inetOrgPerson, organizationalPerson"
          connectionUrl: "ldaps://freeipa.{{ base_domain }}:636"
          usersDn: "cn=users,cn=accounts,{{ freeipa_basedn }}"
          authType: simple
          bindDn: "uid=svc-keycloak-bind,cn=users,cn=accounts,{{ freeipa_basedn }}"
          bindCredential: "{{ freeipa_keycloak_bind_password }}"
          searchScope: 1
          validatePasswordPolicy: false
          trustEmail: true
          # ldapsOnly, not always -- Keycloak's own default JDK
          # truststore already handles every other outbound HTTPS call
          # this instance makes fine; only the LDAPS connection itself
          # needs KC_TRUSTSTORE_PATHS' FreeIPA CA consulted.
          useTruststoreSpi: ldapsOnly
          connectionPooling: true
          pagination: true
        mappers:
          # Keycloak's admin UI auto-creates this "username" mapper for
          # every new LDAP federation, but creating one via the raw API
          # (like this task does) doesn't -- and remove_unspecified_mappers'
          # default of true then deletes it if it somehow existed from a
          # prior UI-driven setup. Without it, Keycloak's LDAP search
          # never fetches usernameLDAPAttribute's value (uid) at all,
          # so every login fails with "User returned from LDAP has null
          # username!" despite connectionUrl/bindDn/bindCredential all
          # being correct.
          - name: username
            providerId: user-attribute-ldap-mapper
            providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
            config:
              ldap.attribute: uid
              user.model.attribute: username
              read.only: true
              is.mandatory.in.ldap: true
          - name: first name
            providerId: user-attribute-ldap-mapper
            providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
            config:
              ldap.attribute: givenName
              user.model.attribute: firstName
              read.only: true
              is.mandatory.in.ldap: false
          - name: last name
            providerId: user-attribute-ldap-mapper
            providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
            config:
              ldap.attribute: sn
              user.model.attribute: lastName
              read.only: true
              is.mandatory.in.ldap: false
          - name: email
            providerId: user-attribute-ldap-mapper
            providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
            config:
              ldap.attribute: mail
              user.model.attribute: email
              read.only: true
              is.mandatory.in.ldap: false
      register: freeipa_ldap_federation_result
      until: freeipa_ldap_federation_result is succeeded
      retries: 3
      delay: 10
      no_log: true
