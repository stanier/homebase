---
# Podman secrets aren't part of the synced container-files tree or
# containerapps_env -- see container-files/stoa/README.md's "Before
# deploying" step 2 -- so they need their own tiny play instead of just
# being another containerapps_secret_files entry in host_vars/stoa.yml.
#
# Each value comes from a stoa_*_api_key var (group_vars/all/vars.yml ->
# a vault_stoa_*_api_key), never typed on a command line, so it never hits
# shell history or `ps` output on either the controller or stoa itself.
# gateway_api_key is agentd's own LLM provider; the rest are
# inference-gateway upstreams (only enabled ones need a real value here --
# an unset/empty var still creates a secret, just an empty one, which is
# harmless for an upstream inference-gateway.yaml doesn't reference).
# Add a new upstream by adding one entry to stoa_podman_secrets below and
# its matching stoa_<name> var + vault_stoa_<name> secret -- the
# Secret=/Environment=..._FILE wiring on the inference-gateway container
# side already covers venice_api_key/arcee_api_key/openrouter_api_key,
# see stoa-inference-gateway.container.
#
# --replace makes this safe to re-run to rotate a key later, but rotating
# won't reach an already-running container on its own --
# `systemctl --user restart stoa-agentd` / `stoa-inference-gateway` on the
# stoa host afterwards (as the containers user), since replacing a Podman
# secret doesn't update the file already bind-mounted into a running
# container.
- name: Create/update stoa's Podman secrets
  hosts: stoa
  become: true

  vars:
    stoa_podman_secrets:
      - name: gateway_api_key
        value: "{{ stoa_gateway_api_key }}"
      - name: openrouter_api_key
        value: "{{ stoa_openrouter_api_key }}"

  tasks:
    - name: Look up the containers user's uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ containers_user }}"

    - name: Compute containers user's XDG_RUNTIME_DIR
      ansible.builtin.set_fact:
        containers_xdg_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[containers_user][1] }}"

    - name: Create/replace stoa's Podman secrets
      ansible.builtin.command:
        cmd: "podman secret create --replace {{ item.name }} -"
        stdin: "{{ item.value }}"
        stdin_add_newline: false
      become_user: "{{ containers_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
      loop: "{{ stoa_podman_secrets }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true
