---
# Rotates stoa's Podman secrets. roles/containerapps creates any missing
# ones on every deploy (containerapps_podman_secrets in host_vars/stoa.yml),
# but never touches one that exists, so a changed vault value only lands
# through this play: it replaces every listed secret, then restarts the
# units that mount them, since a running container keeps the old file.
#
# Values come from stoa_*_api_key vars (group_vars/all/vars.yml -> a
# vault_stoa_*_api_key), never a command line, so they stay out of shell
# history and `ps` on both the controller and stoa.
- name: Rotate stoa's Podman secrets
  hosts: stoa
  become: true

  vars:
    containerapps_podman_secrets_replace: true
    stoa_secret_units:
      - stoa-agentd.service
      - stoa-inference-gateway.service

  tasks:
    - name: Compute containers user's XDG_RUNTIME_DIR
      ansible.builtin.include_role:
        name: boxship
        tasks_from: runtime_dir
        public: true

    # The task file, not include_role: include_role would also run
    # containerapps' dependency boxship, whose main tasks install podman and
    # manage the containers user's account, which secret rotation doesn't need.
    - name: Replace stoa's Podman secrets
      ansible.builtin.include_tasks: ../../roles/containerapps/tasks/podman_secrets.yml

    - name: Restart the units that mount them
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        scope: user
      become_user: "{{ containers_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
      loop: "{{ stoa_secret_units }}"
