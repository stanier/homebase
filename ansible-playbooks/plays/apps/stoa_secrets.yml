---
# Podman secrets aren't part of the synced container-files tree or
# containerapps_env -- see container-files/stoa/README.md's "Before
# deploying" step 2 -- so they need their own tiny play instead of just
# being another containerapps_secret_files entry in host_vars/stoa.yml.
#
# Value comes from stoa_gateway_api_key (group_vars/all/vars.yml ->
# vault_stoa_gateway_api_key), never typed on a command line, so it never
# hits shell history or `ps` output on either the controller or stoa
# itself.
#
# --replace makes this safe to re-run to rotate the key later, but
# rotating won't reach an already-running stoa-agentd on its own --
# `systemctl --user restart stoa-agentd` on the stoa host afterwards
# (as the containers user), since replacing a Podman secret doesn't
# update the file already bind-mounted into a running container.
- name: Create/update stoa's Podman secrets
  hosts: stoa
  become: true

  tasks:
    - name: Look up the containers user's uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ containers_user }}"

    - name: Compute containers user's XDG_RUNTIME_DIR
      ansible.builtin.set_fact:
        containers_xdg_runtime_dir: "/run/user/{{ ansible_facts.getent_passwd[containers_user][1] }}"

    - name: Create/replace the gateway_api_key Podman secret
      ansible.builtin.command:
        cmd: podman secret create --replace gateway_api_key -
        stdin: "{{ stoa_gateway_api_key }}"
        stdin_add_newline: false
      become_user: "{{ containers_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
      changed_when: true
      no_log: true
