- name: Configure FreeIPA HBAC/sudo policy for interactive SSH access
  hosts: freeipa
  become: false
  gather_facts: false

  tasks:
    - name: Require at least one admin user to be configured
      ansible.builtin.assert:
        that: freeipa_admin_users | default([]) | length > 0
        fail_msg: >-
          freeipa_admin_users is empty -- set it in host_vars/freeipa.yml
          with uid/givenname/sn/sshpubkey/password fields per entry,
          password referencing a vault_freeipa_<uid>_password (see
          docs/VAULT.md for the vault_ convention to follow, and this
          play's own header comment for the full shape).

    - name: Require a non-empty password for every admin user
      ansible.builtin.assert:
        that: item.password | default('') | length > 0
        fail_msg: >-
          {{ item.uid }}'s password is empty -- add its
          vault_freeipa_<uid>_password to group_vars/all/vault.yml
          (`ansible-vault edit`, see docs/VAULT.md) before running this
          play.
      loop: "{{ freeipa_admin_users }}"
      loop_control:
        label: "{{ item.uid }}"
      no_log: true

    - name: Create/update each personal admin account
      community.general.ipa_user:
        name: "{{ item.uid }}"
        givenname: "{{ item.givenname }}"
        sn: "{{ item.sn }}"
        sshpubkey: "{{ item.sshpubkey }}"
        password: "{{ item.password }}"
        update_password: on_create
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"
      loop: "{{ freeipa_admin_users }}"
      loop_control:
        label: "{{ item.uid }}"
      no_log: true

    - name: Create the fleet-admins user group
      community.general.ipa_group:
        name: fleet-admins
        user: "{{ freeipa_admin_users | map(attribute='uid') | list }}"
        append: false
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"

    - name: Create the freeipa-server hostgroup
      community.general.ipa_hostgroup:
        name: freeipa-server
        host:
          - "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"

    - name: Create the fleet-vms hostgroup
      community.general.ipa_hostgroup:
        name: fleet-vms
        host: "{{ groups['vm'] | difference([inventory_hostname]) | difference(freeipa_ssh_excluded_vms | default([])) | map('regex_replace', '^(.*)$', '\\1.' + base_domain) | list }}"
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"

    - name: Disable FreeIPA's default allow-all HBAC rule
      community.general.ipa_hbacrule:
        name: allow_all
        state: disabled
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"

    - name: Allow fleet-admins to SSH into the freeipa server and fleet VMs
      community.general.ipa_hbacrule:
        name: allow-fleet-admins-ssh
        hostgroup:
          - freeipa-server
          - fleet-vms
        usergroup:
          - fleet-admins
        service:
          - sshd
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"

    - name: Allow fleet-admins to sudo (password required, no NOPASSWD)
      community.general.ipa_sudorule:
        name: allow-fleet-admins-sudo
        hostgroup:
          - freeipa-server
          - fleet-vms
        usergroup:
          - fleet-admins
        cmdcategory: all
        runasusercategory: all
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"
