- name: Deploy the internal DNS servers
  hosts: dns
  become: true

  roles:
    - common
    - firewall
    - containerapps

- name: Drop the [dns] group's bootstrap resolver
  hosts: dns
  become: true

  tasks:
    - name: Re-point DNS now that dnsguard is answering
      ansible.builtin.import_role:
        name: common
        tasks_from: internal_dns.yml

    - name: Fail if the bootstrap resolver is still in place
      ansible.builtin.assert:
        that: internal_dns_dnsguard_probe is not failed
        fail_msg: >-
          dnsguard still isn't answering on port 53 after deploying
          AdGuardHome -- check `systemctl --user status adguardhome`
          as the containerapps user on dnsguard. dns/dnsguard are
          still using the bootstrap resolver (Quad9).
