---
# Adds FreeIPA as a Gitea LDAP authentication source. Gitea keeps auth
# sources as DB rows created via `gitea admin auth`, not config, hence a
# separate play after plays/apps/podman.yml. Needs roles/freeipa's
# svc-gitea-bind account to exist. systemd-gitea is Quadlet's default
# container name for gitea.container.
- name: Configure Gitea's LDAP authentication source against FreeIPA
  hosts: gitea
  become: true
  gather_facts: false

  tasks:
    - name: Compute containers user's XDG_RUNTIME_DIR
      ansible.builtin.include_role:
        name: boxship
        tasks_from: runtime_dir
        public: true

    - name: List Gitea's existing authentication sources
      ansible.builtin.command:
        cmd: podman exec systemd-gitea gitea admin auth list
      become_user: "{{ containers_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
      register: gitea_auth_list
      changed_when: false

    - name: Add the FreeIPA LDAP authentication source to Gitea
      # add-ldap is the search-then-bind variant (via svc-gitea-bind);
      # add-ldap-simple binds directly as the user. --synchronize-users
      # keeps FreeIPA authoritative.
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - systemd-gitea
          - gitea
          - admin
          - auth
          - add-ldap
          - --name
          - freeipa
          - --security-protocol
          - LDAPS
          - --host
          - "freeipa.{{ base_domain }}"
          - --port
          - "636"
          - --bind-dn
          - "uid=svc-gitea-bind,cn=users,cn=accounts,{{ freeipa_basedn }}"
          - --bind-password
          - "{{ freeipa_gitea_bind_password }}"
          - --user-search-base
          - "cn=users,cn=accounts,{{ freeipa_basedn }}"
          - --user-filter
          - "(&(objectClass=person)(uid=%s))"
          - --username-attribute
          - uid
          - --firstname-attribute
          - givenname
          - --surname-attribute
          - sn
          - --email-attribute
          - mail
          - --synchronize-users
      become_user: "{{ containers_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
      no_log: true
      when: "'freeipa' not in gitea_auth_list.stdout"
