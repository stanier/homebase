# Imports a freeipa_export_users.yml file into this environment's
# FreeIPA. Safe to re-run. Every new account gets freeipa_import_password
# as a one-time password (IPA forces a change at first login);
# update_password: on_create leaves existing accounts' passwords alone.
# Group memberships are only ever added (missing groups are created
# bare; ipausers is skipped). HBAC/sudo rules aren't carried over.
#
#   ansible-playbook --ask-vault-pass -i inventory/<env> \
#     plays/apps/freeipa_import_users.yml \
#     -e freeipa_import_file=/path/to/users.json -e freeipa_import_password='...'
- name: Import a portable FreeIPA user export
  hosts: freeipa
  become: false
  gather_facts: false

  vars:
    freeipa_import_file: "{{ inventory_dir }}/freeipa-users-export.json"
    freeipa_import_password: ""

  tasks:
    - name: Require an import file and a one-time password
      ansible.builtin.assert:
        that:
          - freeipa_import_file | length > 0
          - freeipa_import_password | length > 0
        fail_msg: >-
          Pass -e freeipa_import_file=/path/to/export.json and
          -e freeipa_import_password='...' -- the latter is the
          one-time password every imported account will be forced to
          change at next login, not a stored secret, so generate a
          fresh one per import run (e.g. `openssl rand -base64 18`)
          rather than reusing an old one.

    - name: Read the portable export file
      ansible.builtin.set_fact:
        freeipa_import_document: "{{ lookup('file', freeipa_import_file) | from_json }}"
      delegate_to: localhost
      run_once: true

    - name: Create/update each imported user account
      community.general.ipa_user:
        name: "{{ item.uid[0] }}"
        givenname: "{{ item.givenname[0] | default(omit) }}"
        sn: "{{ item.sn[0] | default(omit) }}"
        mail: "{{ item.mail | default(omit) }}"
        title: "{{ item.title[0] | default(omit) }}"
        homedirectory: "{{ item.homedirectory[0] | default(omit) }}"
        loginshell: "{{ item.loginshell[0] | default(omit) }}"
        sshpubkey: "{{ item.ipasshpubkey | default(omit) }}"
        password: "{{ freeipa_import_password }}"
        update_password: on_create
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"
      loop: "{{ freeipa_import_document.users }}"
      loop_control:
        label: "{{ item.uid[0] }}"
      no_log: true

    - name: Compute each exported group's imported membership
      ansible.builtin.set_fact:
        freeipa_import_groups: "{{ freeipa_import_groups | default({}) | combine({item.1: (freeipa_import_groups[item.1] | default([])) + [item.0.uid[0]]}) }}"
      loop: "{{ freeipa_import_document.users | subelements('memberof_group', skip_missing=True) }}"
      loop_control:
        label: "{{ item.0.uid[0] }}/{{ item.1 }}"

    - name: Add imported users to their exported groups
      community.general.ipa_group:
        name: "{{ item.key }}"
        user: "{{ item.value }}"
        append: true
        ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
        ipa_user: admin
        ipa_pass: "{{ freeipa_admin_password }}"
      loop: "{{ freeipa_import_groups | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.key != 'ipausers'

    - name: Report what was imported
      ansible.builtin.debug:
        msg: >-
          Imported {{ freeipa_import_document.users | length }} user(s)
          (originally exported from
          {{ freeipa_import_document.exported_from_realm }} at
          {{ freeipa_import_document.exported_at }}) into
          {{ freeipa_realm }}. Each imported account must change its
          password at next login.
