---
- name: Configure outbound mail relay
  # mail1 gets a full receiving/relaying Postfix from roles/mail_server
  # (plays/apps/mail_server.yml) instead -- roles/postfix's satellite config
  # would otherwise fight it for /etc/postfix/main.cf and, worse, try to
  # relay mail1's own mail through itself.
  hosts: all:!mail_server
  become: true

  roles:
    - postfix
