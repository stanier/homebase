---
- name: Update packages on all hosts
  hosts: all
  become: true

  pre_tasks:
    - name: Ensure Proxmox nodes use the no-subscription repo, not the paywalled enterprise one
      ansible.builtin.include_role:
        name: hypervisor
        tasks_from: repo_hygiene
        apply:
          tags: [repo_hygiene]
      when: "'proxmox' in group_names"
      tags: repo_hygiene

    - name: Ensure the snippet-writer group/permissions proxmox-tofu needs are in place
      ansible.builtin.include_role:
        name: hypervisor
        tasks_from: snippet_permissions
        apply:
          tags: [snippet_permissions]
      when: "'proxmox' in group_names"
      tags: snippet_permissions

    - name: Snapshot this VM before updating, if it's a known Proxmox VM
      ansible.builtin.include_role:
        name: hypervisor
        tasks_from: snapshot
        apply:
          tags: [snapshot]
      when: proxmox_node is defined and proxmox_vmid is defined
      tags: snapshot

  roles:
    - role: common
      tags:
        - package_update
