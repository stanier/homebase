---
- name: Onboard a new node
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts using whatever interpreter is already present
      ansible.builtin.setup:
      vars:
        ansible_python_interpreter: auto_silent
        # Appended to whatever the inventory already set, not a
        # replacement -- a plain override here used to silently drop
        # dangerzone/testzone's [vm:vars] ProxyCommand (the only path to
        # the non-routed management network), sending every connection
        # from this task straight at management_ip instead of through
        # the bastion and hanging until it timed out.
        #
        # Read via hostvars[inventory_hostname] rather than the bare
        # variable name -- referencing "ansible_ssh_common_args" directly
        # inside this same vars: block that's defining it is a
        # self-reference at the same precedence level, which Ansible
        # can't resolve and fails with "Recursive loop detected in
        # template". hostvars[inventory_hostname] instead reads the
        # already-merged value from inventory (lower precedence),
        # sidestepping the self-reference entirely.
        ansible_ssh_common_args: "{{ (hostvars[inventory_hostname].ansible_ssh_common_args | default('')) ~ ' -o StrictHostKeyChecking=accept-new' }}"

    - name: Install the standardized Python interpreter
      ansible.builtin.package:
        name: "{{ python_package }}"
        state: present
      vars:
        ansible_python_interpreter: auto_silent
        # Appended to whatever the inventory already set, not a
        # replacement -- a plain override here used to silently drop
        # dangerzone/testzone's [vm:vars] ProxyCommand (the only path to
        # the non-routed management network), sending every connection
        # from this task straight at management_ip instead of through
        # the bastion and hanging until it timed out.
        #
        # Read via hostvars[inventory_hostname] rather than the bare
        # variable name -- referencing "ansible_ssh_common_args" directly
        # inside this same vars: block that's defining it is a
        # self-reference at the same precedence level, which Ansible
        # can't resolve and fails with "Recursive loop detected in
        # template". hostvars[inventory_hostname] instead reads the
        # already-merged value from inventory (lower precedence),
        # sidestepping the self-reference entirely.
        ansible_ssh_common_args: "{{ (hostvars[inventory_hostname].ansible_ssh_common_args | default('')) ~ ' -o StrictHostKeyChecking=accept-new' }}"

  tasks:
    - name: Run common role's provisioning tasks
      ansible.builtin.import_role:
        name: common
        tasks_from: provisioning.yml
