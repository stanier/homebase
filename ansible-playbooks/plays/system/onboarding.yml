---
- name: Onboard a new node
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Gather facts using whatever interpreter is already present
      ansible.builtin.setup:
      vars:
        ansible_python_interpreter: auto_silent

    - name: Install the standardized Python interpreter
      ansible.builtin.package:
        name: "{{ python_package }}"
        state: present
      vars:
        ansible_python_interpreter: auto_silent

  tasks:
    - name: Run common role's provisioning tasks
      ansible.builtin.import_role:
        name: common
        tasks_from: provisioning.yml
