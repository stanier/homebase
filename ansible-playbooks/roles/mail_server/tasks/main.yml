---
- name: Preseed postfix debconf selections
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    vtype: select
    value: "No configuration"
  when: ansible_facts['os_family'] == "Debian"

- name: Install postfix
  ansible.builtin.package:
    name: postfix
    state: present

- name: Configure postfix as the receiving/relaying MTA for this domain
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: restart postfix

- name: Add a submission listener for Roundcube's outgoing mail
  ansible.builtin.blockinfile:
    path: /etc/postfix/master.cf
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- roles/mail_server submission listener"
    block: |
      127.0.0.1:submission inet n       -       n       -       -       smtpd
        -o syslog_name=postfix/submission
        -o smtpd_tls_security_level=may
        -o smtpd_relay_restrictions=permit_mynetworks,reject
  notify: restart postfix

- name: Write the virtual mailbox recipient map
  ansible.builtin.template:
    src: virtual_mailboxes.j2
    dest: /etc/postfix/virtual_mailboxes
    owner: root
    group: root
    mode: "0644"
  notify: restart postfix

- name: Ensure postfix is enabled and running
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true

- name: Install the Python cryptography library community.crypto needs
  ansible.builtin.package:
    name: python3-cryptography
    state: present

- name: Ensure Dovecot's TLS directory exists
  ansible.builtin.file:
    path: /srv/dovecot/tls
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0755"

- name: Generate Dovecot's TLS private key
  community.crypto.openssl_privatekey:
    path: /srv/dovecot/tls/tls.key
    type: RSA
    size: 2048
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0644"

- name: Create a temp working directory for CA signing material
  ansible.builtin.tempfile:
    state: directory
    suffix: mail-server-ca
  register: mail_server_ca_tmpdir
  changed_when: false

- name: Write the intermediate CA's cert and key for signing
  ansible.builtin.copy:
    dest: "{{ mail_server_ca_tmpdir.path }}/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { name: intermediate.crt, content: "{{ mail_server_ca_cert }}" }
    - { name: intermediate.key, content: "{{ mail_server_ca_key }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Generate Dovecot's TLS CSR
  community.crypto.openssl_csr:
    path: "{{ mail_server_ca_tmpdir.path }}/tls.csr"
    privatekey_path: /srv/dovecot/tls/tls.key
    common_name: "mail.{{ mail_server_domain }}"
    subject_alt_name:
      - "DNS:mail.{{ mail_server_domain }}"
      - "DNS:{{ inventory_hostname }}.{{ mail_server_domain }}"

- name: Sign Dovecot's TLS certificate with the intermediate CA
  community.crypto.x509_certificate:
    path: /srv/dovecot/tls/tls.crt
    csr_path: "{{ mail_server_ca_tmpdir.path }}/tls.csr"
    privatekey_path: /srv/dovecot/tls/tls.key
    provider: ownca
    ownca_path: "{{ mail_server_ca_tmpdir.path }}/intermediate.crt"
    ownca_privatekey_path: "{{ mail_server_ca_tmpdir.path }}/intermediate.key"
    ownca_not_after: "+{{ mail_server_cert_validity_days }}d"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0644"

- name: Remove the temp CA signing material
  ansible.builtin.file:
    path: "{{ mail_server_ca_tmpdir.path }}"
    state: absent
  changed_when: false

- name: Ensure postfix's own TLS directory exists
  ansible.builtin.file:
    path: /etc/postfix/tls
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Dovecot's TLS cert/key for postfix's own use
  ansible.builtin.copy:
    remote_src: true
    src: "/srv/dovecot/tls/{{ item }}"
    dest: "/etc/postfix/tls/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0600' if item == 'tls.key' else '0644' }}"
  loop:
    - tls.crt
    - tls.key
  notify: restart postfix

- name: Write Dovecot's virtual mailbox passwd-file
  ansible.builtin.template:
    src: dovecot_users.j2
    dest: /srv/dovecot/users
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0644"
  no_log: true

- name: Ensure Dovecot's mail storage directory exists
  ansible.builtin.file:
    path: /srv/dovecot/vmail
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "a+rwX"
