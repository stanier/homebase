---
# Aliases connect to app-proxy's app_ip, where the layer4 listener is.
- name: Generate SSH config entries for appdeploy ssh-type apps
  ansible.builtin.template:
    src: ssh_config_apps.j2
    dest: "{{ ssh_config_dir }}/homebase-ssh-apps-{{ ssh_config_env }}.conf"
    mode: "0600"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  when: appdeploy_ssh_apps | length > 0
