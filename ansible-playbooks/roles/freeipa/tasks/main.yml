---
- name: Check whether this host is already an IPA server
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: freeipa_default_conf
  when: freeipa_enabled

- name: Require admin/DS passwords before installing
  ansible.builtin.assert:
    that:
      - freeipa_admin_password | length > 0
      - freeipa_ds_password | length > 0
    fail_msg: >-
      freeipa_admin_password/freeipa_ds_password are empty -- set
      vault_freeipa_admin_password/vault_freeipa_ds_password in
      group_vars/all/vault.yml first (see docs/VAULT.md).
  when:
    - freeipa_enabled
    - not freeipa_default_conf.stat.exists

- name: Install the FreeIPA server package
  ansible.builtin.package:
    name: ipa-server
    state: present
  when:
    - freeipa_enabled
    - ansible_facts['os_family'] == "RedHat"

- name: Set the FQDN hostname and its /etc/hosts entry
  ansible.builtin.import_role:
    name: common
    tasks_from: set_hostname
  when: freeipa_enabled

- name: Run ipa-server-install
  ansible.builtin.command:
    argv:
      - ipa-server-install
      - --unattended
      - "--realm={{ freeipa_realm }}"
      - "--domain={{ base_domain }}"
      - "--ds-password={{ freeipa_ds_password }}"
      - "--admin-password={{ freeipa_admin_password }}"
      - "--hostname={{ inventory_hostname }}.{{ base_domain }}"
  no_log: true
  when:
    - freeipa_enabled
    - not freeipa_default_conf.stat.exists

- name: Create LDAP bind service accounts for Keycloak/Authentik/Grafana/Gitea
  community.general.ipa_user:
    name: "{{ item.name }}"
    givenname: "{{ item.name }}"
    sn: Bind Account
    password: "{{ item.password }}"
    krbpasswordexpiration: "20990101000000"
    update_password: on_create
    ipa_host: "{{ inventory_hostname }}.{{ base_domain }}"
    ipa_user: admin
    ipa_pass: "{{ freeipa_admin_password }}"
    # The first API call after httpd starts loads ipalib under mod_wsgi and
    # routinely blows past the module's 10s default.
    ipa_timeout: 60
  register: freeipa_bind_user
  until: freeipa_bind_user is not failed
  retries: 3
  delay: 10
  loop:
    - name: svc-keycloak-bind
      password: "{{ freeipa_keycloak_bind_password }}"
    - name: svc-authentik-bind
      password: "{{ freeipa_authentik_bind_password }}"
    - name: svc-grafana-bind
      password: "{{ freeipa_grafana_bind_password }}"
    - name: svc-gitea-bind
      password: "{{ freeipa_gitea_bind_password }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: freeipa_enabled

- name: Fetch FreeIPA's CA certificate for distribution to LDAP consumers
  ansible.builtin.fetch:
    src: /etc/ipa/ca.crt
    dest: "{{ inventory_dir }}/group_vars/files/freeipa-ca.crt"
    flat: true
  when: freeipa_enabled
