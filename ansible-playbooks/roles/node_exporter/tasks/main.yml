---
- name: Ensure node_exporter package matches enabled state
  ansible.builtin.package:
    name: "{{ 'node-exporter' if ansible_facts['os_family'] == 'RedHat' else 'prometheus-node-exporter' }}"
    state: "{{ 'present' if node_exporter_enabled else 'absent' }}"

- name: Configure node_exporter command-line arguments
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/node_exporter).
      ARGS='{{ ((["--collector.systemd"] if node_exporter_systemd_collector | bool else []) + [node_exporter_extra_args]) | select | join(" ") }}'
  when: node_exporter_enabled
  notify: restart node_exporter

- name: Ensure node_exporter is enabled and running
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: started
    enabled: true
  when: node_exporter_enabled

- name: Allow metrics1 to scrape node_exporter through firewalld
  ansible.builtin.include_role:
    name: firewall
    tasks_from: scrape_port
  vars:
    firewall_scrape_port: "{{ node_exporter_port }}"
    firewall_scrape_from: "{{ node_exporter_scrape_from }}"
    firewall_scrape_enabled: "{{ node_exporter_enabled }}"
