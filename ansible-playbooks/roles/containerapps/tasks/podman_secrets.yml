---
# See containerapps_podman_secrets in defaults/main.yml. Also used on its
# own by plays/apps/stoa_secrets.yml to rotate secrets.
- name: Check which Podman secrets already exist
  ansible.builtin.command:
    cmd: "podman secret exists {{ item }}"
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  loop: "{{ containerapps_podman_secrets | map(attribute='name') | list }}"
  register: containerapps_podman_secrets_exist
  changed_when: false
  failed_when: containerapps_podman_secrets_exist.rc not in [0, 1]

- name: Create missing (or, when replacing, all) Podman secrets
  ansible.builtin.command:
    cmd: "podman secret create --replace {{ item }} -"
    stdin: "{{ (containerapps_podman_secrets | items2dict(key_name='name', value_name='value'))[item] }}"
    stdin_add_newline: false
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  loop: >-
    {{ containerapps_podman_secrets | map(attribute='name') | list
       if containerapps_podman_secrets_replace | bool else
       containerapps_podman_secrets_exist.results | selectattr('rc', 'eq', 1)
       | map(attribute='item') | list }}
  changed_when: true
  no_log: true
