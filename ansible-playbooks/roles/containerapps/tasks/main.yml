---
- name: Ensure containers user's podman config directory exists
  ansible.builtin.file:
    path: "{{ containers_home }}/.config/containers"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0700"

- name: Configure rootless podman cgroup manager override
  ansible.builtin.copy:
    dest: "{{ containers_home }}/.config/containers/containers.conf"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0644"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"
  when: containerapps_cgroup_manager == "cgroupfs"

- name: Remove rootless podman cgroup manager override
  ansible.builtin.file:
    path: "{{ containers_home }}/.config/containers/containers.conf"
    state: absent
  when: containerapps_cgroup_manager != "cgroupfs"

- name: Load required kernel modules for this host's container services
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ containerapps_kernel_modules }}"

- name: Persist required kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/containerapps.conf
    mode: "0644"
    content: |
      {% for item in containerapps_kernel_modules %}
      {{ item }}
      {% endfor %}
  when: containerapps_kernel_modules | length > 0

- name: Install host packages this host's container services need
  ansible.builtin.package:
    name: "{{ containerapps_host_packages }}"
    state: present
  when: containerapps_host_packages | length > 0
  register: containerapps_host_packages_install

- name: Write udev rules for devices passed into containers
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/90-containerapps.rules
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/containerapps, containerapps_udev_rules).
      {% for rule in containerapps_udev_rules %}
      {{ rule }}
      {% endfor %}
  when: containerapps_udev_rules | length > 0
  register: containerapps_udev_rules_write

- name: Apply changed udev rules to devices already present
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
  when: containerapps_udev_rules_write is changed

- name: Set SELinux booleans this host's container services need
  ansible.posix.seboolean:
    name: "{{ item.key }}"
    state: "{{ item.value }}"
    persistent: true
  loop: "{{ containerapps_selinux_booleans | dict2items }}"
  when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'

- name: Replay USB device adds so newly installed drivers bind
  # A device plugged in before its driver package was installed sits
  # unbound until the next boot otherwise.
  ansible.builtin.command: udevadm trigger --action=add --subsystem-match=usb
  when: containerapps_host_packages_install is changed

- name: Lower the unprivileged-port floor for Network=host services that need it
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ containerapps_unprivileged_port_start }}"
    sysctl_set: true
    state: present
    reload: true
  when: containerapps_unprivileged_port_start != ""

- name: Determine container-files repo host and port
  ansible.builtin.set_fact:
    # containerapps_repo is ssh://user@host:port/path.
    containerapps_git_host: "{{ containerapps_repo | regex_replace('^ssh://[^@]+@', '') | regex_replace(':.*$', '') }}"
    containerapps_git_port: "{{ containerapps_repo | regex_replace('^ssh://[^@]+@[^:]+:', '') | regex_replace('/.*$', '') }}"
  when: containerapps_source == "git"

- name: Scan SSH host key for container-files repo host
  # rsa: Gitea's built-in SSH server only offers an RSA host key.
  ansible.builtin.command: "ssh-keyscan -t rsa -p {{ containerapps_git_port }} {{ containerapps_git_host }}"
  register: containerapps_repo_hostkey
  changed_when: false
  delegate_to: localhost
  become: false
  when: containerapps_source == "git"

- name: Trust container-files repo host key for containers user
  ansible.builtin.known_hosts:
    # Must match the "[host]:port" form ssh-keyscan -p writes.
    name: "[{{ containerapps_git_host }}]:{{ containerapps_git_port }}"
    key: "{{ containerapps_repo_hostkey.stdout }}"
    path: "{{ containers_home }}/.ssh/known_hosts"
    state: present
  become_user: "{{ containers_user }}"
  when: containerapps_source == "git"

- name: Generate SSH keypair for containers user
  community.crypto.openssh_keypair:
    path: "{{ containers_home }}/.ssh/id_ed25519"
    type: ed25519
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"
  become_user: "{{ containers_user }}"
  register: containerapps_deploy_key
  when: containerapps_source == "git"

- name: Show public key to register as a Gitea deploy key
  ansible.builtin.debug:
    msg: >-
      containers_user has no access to {{ containerapps_repo }} yet.
      Add this public key as a deploy key (with read access) on the repo,
      then re-run: {{ containerapps_deploy_key.public_key }}
  when:
    - containerapps_source == "git"
    - containerapps_deploy_key.changed

- name: Clone or update container-files repo
  ansible.builtin.git:
    repo: "{{ containerapps_repo }}"
    dest: "{{ containerapps_dest }}"
    version: "{{ containerapps_version }}"
  become_user: "{{ containers_user }}"
  register: containerapps_git_clone
  when: containerapps_source == "git"

- name: List files changed by this container-files update
  # Feeds restart detection below: a service restarts when anything in
  # its directory changed (e.g. bind-mounted config), not just its units.
  ansible.builtin.command:
    cmd: "git diff --name-only {{ containerapps_git_clone.before }} {{ containerapps_git_clone.after }}"
    chdir: "{{ containerapps_dest }}"
  become_user: "{{ containers_user }}"
  register: containerapps_changed_paths
  changed_when: false
  when:
    - containerapps_source == "git"
    - containerapps_git_clone.changed
    - containerapps_git_clone.before is defined
    - containerapps_git_clone.before != containerapps_git_clone.after

- name: Install rsync for local sync of container-files
  ansible.builtin.package:
    name: rsync
    state: present
  when: containerapps_source == "local"

- name: Sync container-files from local checkout
  ansible.posix.synchronize:
    src: "{{ containerapps_local_src }}/"
    dest: "{{ containerapps_dest }}/"
    delete: true
    rsync_path: sudo rsync
    # rsync runs on the controller outside the connection plugin; this
    # makes it honour ansible_ssh_common_args' bastion ProxyCommand.
    use_ssh_args: true
    rsync_opts:
      - "--chown={{ containers_user }}:{{ containers_user }}"
      # act_runner's runtime registration identity; deleting it forces a
      # brand-new runner registration on every sync.
      - "--exclude=gitea-runner/data/.runner"
  when: containerapps_source == "local"

- name: Ensure each deployed service's extra directories exist
  # Relative paths are inside containerapps_dest and are created as
  # containers_user; absolute ones (outside the synced tree, e.g. gitea's
  # repo data) are created as root and handed to containers_user, since
  # their parents are root-owned. See containerapps_service_dirs.
  ansible.builtin.file:
    path: "{{ item.1.path if item.1.path.startswith('/') else containerapps_dest + '/' + item.1.path }}"
    state: directory
    owner: "{{ containers_user if item.1.path.startswith('/') else omit }}"
    group: "{{ containers_user if item.1.path.startswith('/') else omit }}"
    mode: "{{ item.1.mode | default('0750') }}"
    recurse: "{{ item.1.recurse | default(false) }}"
  become_user: "{{ 'root' if item.1.path.startswith('/') else containers_user }}"
  loop: "{{ containerapps_service_dirs | dict2items(key_name='service', value_name='dirs') | selectattr('service', 'in', containerapps_quadlet_services) | subelements('dirs') }}"
  loop_control:
    label: "{{ item.1.path }}"

- name: Ensure parent directories exist for templated secret files
  # item.dest is relative to containerapps_dest unless it starts with
  # "/" (config bind-mounted from outside the synced tree, e.g. gitea's
  # app.ini). Absolute entries are created as root since their parents
  # are root-owned, and should set dir_mode to match any
  # containerapps_service_dirs entry for the same directory.
  ansible.builtin.file:
    path: "{{ (item.dest | dirname) if item.dest.startswith('/') else (containerapps_dest + '/' + (item.dest | dirname)) }}"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "{{ item.dir_mode | default('0700') }}"
  become_user: "{{ 'root' if item.dest.startswith('/') else containers_user }}"
  loop: "{{ containerapps_secret_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Write templated secret files for container services
  ansible.builtin.copy:
    dest: "{{ item.dest if item.dest.startswith('/') else containerapps_dest + '/' + item.dest }}"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "{{ item.mode | default('0600') }}"
    content: "{{ item.content }}"
  become_user: "{{ containers_user }}"
  loop: "{{ containerapps_secret_files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: containerapps_secret_files_write
  no_log: true

- name: Determine which quadlet-managed services had non-unit-file changes
  # Services whose tracked files (git diff) or templated secret files
  # changed get restarted below, not just started. A secret file's service
  # is its dest's first path segment, or item.service for absolute dests.
  ansible.builtin.set_fact:
    containerapps_quadlet_data_changed: >-
      {{
        (
          (containerapps_changed_paths.stdout_lines | default([])
            | map('regex_replace', '^([^/]+)/.*$', '\1') | list)
          +
          (containerapps_secret_files_write.results | default([])
            | selectattr('changed')
            | selectattr('item.service', 'defined')
            | map(attribute='item.service') | list)
          +
          (containerapps_secret_files_write.results | default([])
            | selectattr('changed')
            | rejectattr('item.service', 'defined')
            | map(attribute='item.dest')
            | map('regex_replace', '^([^/]+)/.*$', '\1') | list)
        )
        | unique
        | intersect(containerapps_quadlet_services + containerapps_quadlet_services_disabled)
      }}

- name: Check whether gitea-runner has already registered with Gitea
  # Once registered, act_runner ignores the registration token. Skipping
  # token generation then keeps gitea-runner's .env stable, so it isn't
  # restarted (killing any running CI job) on every run.
  ansible.builtin.stat:
    path: "{{ containerapps_dest }}/gitea-runner/data/.runner"
  delegate_to: gitea-runner-1
  register: containerapps_gitea_runner_registered
  when: inventory_hostname == 'gitea'

- name: Generate a fresh Gitea Actions runner registration token
  # Needs gitea's container running, which it isn't on a fresh host's
  # first pass (services start further down) -- hence failed_when: false,
  # and plays/apps/podman.yml running this role on gitea alone first.
  # systemd-gitea is Quadlet's default container name.
  ansible.builtin.command:
    cmd: podman exec systemd-gitea gitea actions generate-runner-token
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  register: containerapps_gitea_runner_token
  changed_when: false
  failed_when: false
  no_log: true
  when: >-
    inventory_hostname == 'gitea' and
    'gitea' in containerapps_quadlet_services and
    not (containerapps_gitea_runner_registered.stat.exists | default(false))

- name: Expose the generated runner token for gitea-runner's .env
  ansible.builtin.set_fact:
    gitea_runner_registration_token: "{{ containerapps_gitea_runner_token.stdout | trim }}"
  no_log: true
  when: >-
    inventory_hostname == 'gitea' and
    containerapps_gitea_runner_token.rc is defined and
    containerapps_gitea_runner_token.rc == 0

- name: Write per-service .env files with secrets
  ansible.builtin.copy:
    dest: "{{ containerapps_dest }}/{{ item.key }}/.env"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"
    content: |
      {% for env_name, env_value in item.value.items() %}
      {{ env_name }}={{ env_value }}
      {% endfor %}
  become_user: "{{ containers_user }}"
  loop: "{{ containerapps_env | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key in containerapps_quadlet_services
  register: containerapps_env_files_write
  no_log: true

- name: Include changed .env files in the quadlet restart-detection
  # Separate from the fact above because the .env write has to follow
  # token generation.
  ansible.builtin.set_fact:
    containerapps_quadlet_data_changed: >-
      {{
        (containerapps_quadlet_data_changed
          + (containerapps_env_files_write.results | default([])
              | selectattr('changed')
              | map(attribute='item.key') | list)
        ) | unique
      }}

- name: Create this host's Podman secrets
  ansible.builtin.include_tasks: podman_secrets.yml
  when: containerapps_podman_secrets | length > 0

- name: Export XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS for interactive containers-user shells
  # `sudo -u containers bash` doesn't go through logind, so without
  # these `systemctl --user` fails with "Failed to connect to bus".
  ansible.builtin.blockinfile:
    path: "{{ containers_home }}/.bashrc"
    create: true
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- XDG session vars"
    block: |
      if [ -z "$XDG_RUNTIME_DIR" ]; then
          export XDG_RUNTIME_DIR="{{ containers_xdg_runtime_dir }}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      fi

- name: Pre-pull this host's container images in parallel
  # A quadlet unit pulls its image inside ExecStart, so the one-by-one
  # start loop below would otherwise download every image in sequence on
  # a fresh host. Already-present images are skipped without contacting
  # the registry; Image=*.build is left to its .build unit. Prints each
  # image it pulled, so a run with nothing to pull reports ok.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      shopt -s nullglob
      units=({% for svc in item.services %}{{ (containerapps_dest + '/' + svc) | quote }}/*.container {% endfor %})
      [[ -n "${units[0]-}" ]] || exit 0
      sed -n '/\.build$/!s/^Image=//p' "${units[@]}" | sort -u \
        | xargs -r -P {{ containerapps_image_pull_parallelism }} -I{} \
            sh -c 'podman image exists "$1" || { podman pull --quiet "$1" >/dev/null && echo "$1"; }' _ {}
  become_user: "{{ omit if item.rootful else containers_user }}"
  environment: "{{ {} if item.rootful else {'XDG_RUNTIME_DIR': containers_xdg_runtime_dir} }}"
  loop:
    - rootful: false
      services: "{{ containerapps_quadlet_services | difference(containerapps_quadlet_services_rootful) }}"
    - rootful: true
      services: "{{ containerapps_quadlet_services | intersect(containerapps_quadlet_services_rootful) }}"
  loop_control:
    label: "{{ 'rootful' if item.rootful else 'rootless' }}"
  when: item.services | length > 0
  register: containerapps_image_pull
  changed_when: containerapps_image_pull.stdout | length > 0
  retries: 2
  delay: 5
  until: containerapps_image_pull is succeeded

- name: Build custom gitea-runner job container image
  # Job image with the internal root CA baked in; gitea-runner's
  # config.yaml maps "ubuntu-latest" to this tag (see its Containerfile).
  # Not a quadlet .build unit since no Image= references it.
  ansible.builtin.command:
    cmd: podman build -t localhost/gitea-runner-job:ubuntu-latest -f Containerfile .
    chdir: "{{ containerapps_dest }}/gitea-runner"
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  when: "'gitea-runner' in containerapps_quadlet_services"
  register: containerapps_gitea_runner_build
  changed_when: "'Writing manifest' in containerapps_gitea_runner_build.stderr"

- name: Ensure SELinux policy development tools are available
  ansible.builtin.package:
    name:
      - checkpolicy
      - policycoreutils-python-utils
    state: present
  when: "'gitea-runner' in containerapps_quadlet_services"

- name: Ensure local SELinux policy module directory exists
  ansible.builtin.file:
    path: /etc/selinux/local
    state: directory
    mode: "0700"
  when: "'gitea-runner' in containerapps_quadlet_services"

- name: Deploy custom SELinux policy module source for gitea-runner's podman socket access
  # gitea-runner mounts the host's rootless podman.sock as docker.sock.
  # SELinux's connectto check is against the listening process's context
  # (container_runtime_t), not the socket file's label, so relabeling
  # doesn't help and no boolean covers it. This is the single rule
  # audit2allow generates for the denial. See docs/GITEA_ACTIONS.md.
  ansible.builtin.copy:
    dest: /etc/selinux/local/gitea_runner_podman_sock.te
    mode: "0644"
    content: |
      module gitea_runner_podman_sock 1.0;

      require {
          type container_t;
          type container_runtime_t;
          class unix_stream_socket connectto;
      }

      #============= container_t ==============
      allow container_t container_runtime_t:unix_stream_socket connectto;
  when: "'gitea-runner' in containerapps_quadlet_services"
  register: containerapps_selinux_module_src

- name: Compile and load the custom SELinux policy module
  ansible.builtin.shell: |
    set -e
    checkmodule -M -m -o /etc/selinux/local/gitea_runner_podman_sock.mod /etc/selinux/local/gitea_runner_podman_sock.te
    semodule_package -o /etc/selinux/local/gitea_runner_podman_sock.pp -m /etc/selinux/local/gitea_runner_podman_sock.mod
    semodule -i /etc/selinux/local/gitea_runner_podman_sock.pp
  when:
    - "'gitea-runner' in containerapps_quadlet_services"
    - containerapps_selinux_module_src.changed

- name: Enable podman API socket for containers user
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  register: containerapps_podman_socket
  retries: 5
  delay: 3
  until: containerapps_podman_socket is succeeded

- name: Ensure containers user's quadlet unit directory exists
  ansible.builtin.file:
    path: "{{ containers_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0755"
  when: (containerapps_quadlet_services + containerapps_quadlet_services_disabled) | difference(containerapps_quadlet_services_rootful) | length > 0

- name: Ensure system quadlet unit directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: (containerapps_quadlet_services + containerapps_quadlet_services_disabled) | intersect(containerapps_quadlet_services_rootful) | length > 0

- name: Reset the queue of quadlet units to start
  # Facts outlive the play, and plays/apps/podman.yml runs this role on
  # gitea twice.
  ansible.builtin.set_fact:
    containerapps_quadlet_units: []

- name: Sync each quadlet-managed service's unit files
  ansible.builtin.include_tasks: quadlet_service.yml
  loop: "{{ containerapps_quadlet_services }}"
  loop_control:
    loop_var: containerapps_quadlet_service
    label: "{{ containerapps_quadlet_service }}"

- name: Sync (but don't start) each disabled quadlet-managed service's unit files
  ansible.builtin.include_tasks: quadlet_service.yml
  vars:
    containerapps_quadlet_service_enabled: false
  loop: "{{ containerapps_quadlet_services_disabled }}"
  loop_control:
    loop_var: containerapps_quadlet_service
    label: "{{ containerapps_quadlet_service }}"

- name: Reload user systemd so Quadlet regenerates rootless units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  when: (containerapps_quadlet_services + containerapps_quadlet_services_disabled) | difference(containerapps_quadlet_services_rootful) | length > 0

- name: Reload system systemd so Quadlet regenerates rootful units
  ansible.builtin.systemd:
    daemon_reload: true
  when: (containerapps_quadlet_services + containerapps_quadlet_services_disabled) | intersect(containerapps_quadlet_services_rootful) | length > 0

- name: Start or restart quadlet-managed units
  # In containerapps_quadlet_services order, as queued by
  # quadlet_service.yml.
  ansible.builtin.systemd:
    name: "{{ item.unit }}"
    scope: "{{ 'system' if item.rootful else 'user' }}"
    state: "{{ 'restarted' if item.restart else 'started' }}"
  become_user: "{{ omit if item.rootful else containers_user }}"
  environment: "{{ {} if item.rootful else {'XDG_RUNTIME_DIR': containers_xdg_runtime_dir} }}"
  loop: "{{ containerapps_quadlet_units | selectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.unit }}"
  register: containerapps_quadlet_service_start
  retries: 3
  delay: 3
  until: containerapps_quadlet_service_start is succeeded
