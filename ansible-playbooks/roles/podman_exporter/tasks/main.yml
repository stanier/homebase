---
- name: Ensure podman_exporter package is installed
  ansible.builtin.package:
    name: prometheus-podman-exporter
    state: present
  when: podman_exporter_enabled

- name: Compute containers user's XDG_RUNTIME_DIR
  ansible.builtin.include_role:
    name: boxship
    tasks_from: runtime_dir
    public: true

- name: Enable and start podman_exporter for the containers user
  ansible.builtin.systemd:
    name: prometheus-podman-exporter
    scope: user
    state: started
    enabled: true
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  when: podman_exporter_enabled

- name: Allow metrics1 to scrape podman_exporter through firewalld
  ansible.builtin.include_role:
    name: firewall
    tasks_from: scrape_port
  vars:
    firewall_scrape_port: "{{ podman_exporter_port }}"
    firewall_scrape_from: "{{ podman_exporter_scrape_from }}"
    firewall_scrape_enabled: "{{ podman_exporter_enabled }}"

- name: Stop and disable podman_exporter for the containers user when opted out
  ansible.builtin.systemd:
    name: prometheus-podman-exporter
    scope: user
    state: stopped
    enabled: false
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ containers_xdg_runtime_dir }}"
  when: not podman_exporter_enabled
  failed_when: false

- name: Remove podman_exporter package when opted out
  ansible.builtin.package:
    name: prometheus-podman-exporter
    state: absent
  when: not podman_exporter_enabled
