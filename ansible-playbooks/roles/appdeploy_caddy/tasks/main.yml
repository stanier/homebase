---
# The container-sandbox side of appdeploy's cross-host split: apphost
# (roles/appdeploy) can't write Caddy's config directly since it's not
# on the same filesystem, so it SSHes in through this forced-command key
# instead -- see templates/caddy-route.sh.j2 for what that key can
# actually do (exactly one thing: write one route file, reload Caddy).

- name: Ensure caddy-apps directory exists
  ansible.builtin.file:
    path: "{{ containers_home }}/appdeploy-state/caddy-apps"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"

# Holds the layer4 route snippet for each ssh-type app (see
# templates/caddy-route.sh.j2), imported into the layer4 block by
# container-files/caddy's Caddyfile -- separate from caddy-apps above
# since these aren't ordinary http vhosts.
- name: Ensure ssh-apps directory exists
  ansible.builtin.file:
    path: "{{ containers_home }}/appdeploy-state/ssh-apps"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"

- name: Install caddy-route.sh
  ansible.builtin.template:
    src: caddy-route.sh.j2
    dest: "{{ containers_home }}/appdeploy-caddy-route.sh"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"

- name: Ensure containers user's .ssh directory exists
  ansible.builtin.include_tasks: ../../common/tasks/ensure_ssh_dir.yml

- name: Restrict apphost's key to running caddy-route.sh only
  ansible.posix.authorized_key:
    user: "{{ containers_user }}"
    key: "{{ appdeploy_caddy_public_key }}"
    # See roles/appdeploy's identical warning: no whitespace anywhere in
    # this value outside the quoted command, or sshd silently truncates
    # the options list at the first unquoted space and the whole entry
    # stops working with no useful error.
    key_options: "command=\"{{ containers_home }}/appdeploy-caddy-route.sh\",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty"
    state: present
  when: appdeploy_caddy_public_key | length > 0
