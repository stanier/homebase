---
- name: Install caddy-route.sh
  ansible.builtin.template:
    src: caddy-route.sh.j2
    dest: "{{ containers_home }}/appdeploy-caddy-route.sh"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"

- name: Restrict apphost's key to running caddy-route.sh only
  ansible.posix.authorized_key:
    user: "{{ containers_user }}"
    key: "{{ appdeploy_caddy_public_key }}"
    key_options: "command=\"{{ containers_home }}/appdeploy-caddy-route.sh\",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty"
    state: present
  when: appdeploy_caddy_public_key | length > 0
