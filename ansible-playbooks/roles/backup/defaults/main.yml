---
# One restic repo per host, so a rebuilt host just points at the same
# path. Include {{ inventory_hostname }}, e.g.:
#   backup_repository: "s3:https://s3.example.com/homelab-backups/{{ inventory_hostname }}"
backup_repository: ""

# Restic repo encryption password -- set via vault_backup_password, same
# across every host (it's the repo *path* that's per-host, not this).
backup_password: ""

# Credentials for whatever backup_repository's backend needs. Only the S3
# case is wired up here since that's what this fleet uses; extend with
# more EnvironmentFile lines in templates/backup.env.j2 if a different
# restic backend is ever needed.
backup_aws_access_key_id: ""
backup_aws_secret_access_key: ""

# Standard restic retention policy, applied by `restic forget --prune`
# after every backup run.
backup_retention_daily: 7
backup_retention_weekly: 4
backup_retention_monthly: 6

# systemd OnCalendar= expression for the backup timer.
backup_on_calendar: "03:30"

# Quadlet services on this host to skip -- e.g. something whose data is
# trivially rebuildable and not worth the backup window. Empty by
# default: everything containerapps has deployed here gets backed up.
backup_exclude_services: []
