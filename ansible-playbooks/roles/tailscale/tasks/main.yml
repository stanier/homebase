---
- name: Add Tailscale repo (RHEL-family)
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_facts['distribution_major_version'] }}/tailscale.repo"
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"
  when:
    - tailscale_enabled
    - ansible_facts['os_family'] == 'RedHat'

- name: Install Tailscale
  ansible.builtin.package:
    name: tailscale
    state: present
  when: tailscale_enabled

- name: Ensure tailscaled is running and enabled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  when: tailscale_enabled

- name: Enable IPv4 forwarding (required to advertise subnet routes)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when:
    - tailscale_enabled
    - "'--advertise-routes' in tailscale_extra_args"

- name: Check current Tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: tailscale_enabled

# tailscaled reports BackendState "Running" once authenticated and
# connected -- anything else (NeedsLogin, Stopped, ...) means `tailscale
# up` still needs to run. Skips reauthenticating already-joined hosts.
- name: Bring up Tailscale
  ansible.builtin.command: >
    tailscale up --authkey={{ tailscale_authkey }} {{ tailscale_extra_args }}
  when:
    - tailscale_enabled
    - tailscale_authkey != ''
    - (tailscale_status.stdout | from_json).BackendState != 'Running'

# `up` only runs the initial join above -- once a node is already
# Running, `set` is the idempotent way to change flags like
# --advertise-routes without needing the (possibly single-use) authkey
# again.
- name: Apply Tailscale settings on already-joined nodes
  ansible.builtin.command: tailscale set {{ tailscale_extra_args }}
  changed_when: false
  when:
    - tailscale_enabled
    - tailscale_extra_args != ''
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
