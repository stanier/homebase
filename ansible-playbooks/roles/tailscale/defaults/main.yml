---
tailscale_enabled: false

# Auth key used for unattended `tailscale up`. Leave unset to install and
# start tailscaled without joining a tailnet (e.g. to join manually via
# `tailscale up` over SSH). Source from vault_tailscale_authkey in
# group_vars/all/vault.yml -- see docs/VAULT.md.
tailscale_authkey: ""

# Extra flags appended to `tailscale up`, e.g. to advertise subnet routes
# or accept them:
#   tailscale_extra_args: "--advertise-routes=198.51.100.0/24 --accept-routes"
tailscale_extra_args: ""
