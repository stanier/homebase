---
- name: Disable the paywalled Proxmox enterprise repo (no subscription on this homelab)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Enable the free Proxmox no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/hypervisor). Replaces the
      # subscription-only pve-enterprise repo.
      deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription
  register: proxmox_repo_file

- name: Refresh apt cache after changing Proxmox repos
  ansible.builtin.apt:
    update_cache: true
  when: proxmox_repo_file is changed
