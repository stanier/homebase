---
# Builds one missing template (tmpl_key/tmpl), included from
# build_templates.yml. staged_image lives on the Proxmox node itself
# (this file runs on the node's normal SSH connection, same as every
# other role in this repo); every API task below is delegated to
# localhost.
#
# The staged file has to sit exactly where the import task's
# "<STORAGE>:import/<FILE>" volid resolves to, which depends on
# proxmox_storage_pool's own path on this node (e.g. "local" ->
# /var/lib/vz, "data" -> /mount/data on homelab). Ask Proxmox rather
# than hardcoding it, so the two can't drift apart per node.
- name: "{{ tmpl_key }}: resolve the staged image's path on this node's storage"
  ansible.builtin.command:
    argv: ["pvesm", "path", "{{ proxmox_storage_pool }}:import/{{ tmpl_key }}.qcow2"]
  register: staged_image_path
  changed_when: false
  become: true

- name: "{{ tmpl_key }}: remember the staged image path"
  ansible.builtin.set_fact:
    staged_image: "{{ staged_image_path.stdout | trim }}"

- name: "{{ tmpl_key }}: ensure the image staging dir exists"
  ansible.builtin.file:
    path: "{{ staged_image | dirname }}"
    state: directory
    mode: "0755"
  become: true

- name: "{{ tmpl_key }}: download the cloud image to this node"
  ansible.builtin.get_url:
    url: "{{ tmpl.image_url }}"
    dest: "{{ staged_image }}"
    mode: "0644"
  become: true

- name: "{{ tmpl_key }}: ensure virt-customize is available on this node"
  ansible.builtin.package:
    name: libguestfs-tools
    state: present
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

# Bakes proxmox_template_bake_packages[tmpl.os_family] into the staged
# qcow2 in place, before it's imported as the template's boot disk --
# see that var's own comment for why these packages specifically and
# not others. --network is required: without it the appliance
# virt-customize boots to run --install in has no route out to the
# guest's package mirrors, so every --install would just fail offline.
#
# Steps, in command-line order (one appliance boot covers all of them):
# - (RedHat) append proxmox_template_dnf_conf_lines to dnf.conf first,
#   so the bake's own upgrade/installs already use them.
# - (RedHat) pin /etc/kernel/cmdline to the image's own default kernel
#   args (minus crashkernel=). Without it, 20-grub.install builds the BLS
#   entry for any kernel --update pulls in from /proc/cmdline -- i.e.
#   the libguestfs appliance's (root= its own disk, quiet, panic=1) --
#   and makes that entry the default, so every clone hangs at "Welcome
#   to GRUB!". Removed again at the end so clones' future kernel
#   installs go back to their real /proc/cmdline.
# - --update everything the upstream image shipped, so a fresh clone's
#   first common/update_packages.yml run only pulls what changed since
#   this template was built, not everything since upstream cut the
#   image -- that full upgrade was ~10 minutes of every testrun.sh
#   --clean. Rebuild templates periodically to keep the gap small (see
#   build_templates.yml).
# - --install each package as its own operation, in list order.
# - --uninstall proxmox_template_bake_uninstall_packages.
# - (RedHat) strip crashkernel= from /etc/default/grub and every
#   installed kernel's entry (incl. one --update just pulled in) --
#   after kdump-utils' own reinstall hook is gone with the package.
# - disable proxmox_template_bake_disabled_services, mask
#   proxmox_template_bake_masked_services.
# - clear the package-manager cache, so a clone's first real install
#   isn't confused by a stale index the way the upstream Rocky cloud
#   image's own dnf cache is.
# - (RedHat) relabel the whole filesystem with the guest's own setfiles.
#   The appliance boots selinux=0, so every file rpm/useradd wrote above
#   (incl. a --update'd /usr/lib/systemd/systemd) is left unlabeled.
#   virt-customize's own relabel needs libguestfs' "selinuxrelabel"
#   feature, which Debian's (i.e. Proxmox's) build lacks -- it silently
#   falls back to touching /.autorelabel, and a clone then freezes at
#   boot ("Failed to allocate manager object") because an unlabeled
#   systemd never transitions to init_t to get as far as relabelling.
#   So: relabel here, drop the /.autorelabel, and --no-selinux-relabel
#   so virt-customize doesn't touch it again after us.
# - (RedHat) truncate /etc/machine-id -- systemd's %post during
#   --update fills it in, which would give every clone the same ID;
#   empty, each clone generates its own on first boot like upstream.
- name: "{{ tmpl_key }}: bake baseline packages into the staged image"
  ansible.builtin.command:
    # Each package gets its own --install so virt-customize's "run
    # operations in the order given" behaviour is what decides ordering
    # (epel-release before node-exporter), not comma-list parsing inside
    # a single --install. bake_install_args is built below as a real
    # Ansible/Jinja list (namespace + for-loop), so this argv is a plain
    # list expression throughout -- no shell involved.
    argv: >-
      {{
        ['virt-customize', '-a', staged_image, '--network']
        + (bake_redhat_args + bake_kernel_cmdline_args if tmpl.os_family == 'RedHat' else [])
        + ['--update']
        + bake_install_args
        + bake_uninstall_args
        + (bake_crashkernel_args + ['--delete', '/etc/kernel/cmdline'] if tmpl.os_family == 'RedHat' else [])
        + bake_disable_args
        + bake_mask_args
        + ['--run-command', 'dnf clean all' if tmpl.os_family == 'RedHat' else 'apt-get clean']
        + (bake_selinux_args if tmpl.os_family == 'RedHat' else [])
      }}
  vars:
    bake_install_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pkg in proxmox_template_bake_packages[tmpl.os_family] -%}
        {%- set ns.args = ns.args + ['--install', pkg] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_uninstall_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pkg in proxmox_template_bake_uninstall_packages.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--uninstall', pkg] -%}
      {%- endfor -%}
      {{ ns.args }}
    # grubby --info=DEFAULT prints the default entry as shell-quoted
    # args="..." / root="..." lines; written before --update, so DEFAULT
    # is still the image's original kernel.
    bake_kernel_cmdline_args:
      - --run-command
      - >-
        eval "$(grubby --info=DEFAULT | grep -E '^(args|root)=')"
        && test -n "$root"
        && echo "root=$root $args" | sed -E 's/ ?crashkernel=[^ ]*//' > /etc/kernel/cmdline
    bake_crashkernel_args:
      - --run-command
      - "sed -i -E 's/ ?crashkernel=[^ \"]*//' /etc/default/grub"
      - --run-command
      - grubby --update-kernel=ALL --remove-args=crashkernel
    bake_disable_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for svc in proxmox_template_bake_disabled_services.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--run-command', 'systemctl disable ' ~ svc] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_mask_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for svc in proxmox_template_bake_masked_services.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--run-command', 'systemctl mask ' ~ svc] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_selinux_args:
      - --truncate
      - /etc/machine-id
      - --run-command
      - >-
        setfiles -F -T 0 -e /proc -e /sys -e /dev -e /run -e /boot/efi
        /etc/selinux/targeted/contexts/files/file_contexts /
      - --delete
      - /.autorelabel
      - --no-selinux-relabel
    bake_redhat_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for line in proxmox_template_dnf_conf_lines -%}
        {%- set ns.args = ns.args + ['--append-line', '/etc/dnf/dnf.conf:' ~ line] -%}
      {%- endfor -%}
      {{ ns.args }}
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

- delegate_to: localhost
  become: false
  vars:
    # ansible_playbook_python is the interpreter actually running
    # ansible-playbook itself, which isn't necessarily the one with
    # proxmoxer installed -- e.g. a system-wide ansible-core install
    # alongside a per-operator venv used only for extra libraries.
    # $VIRTUAL_ENV (set by the shell on `source venv/bin/activate`) is
    # inherited by the ansible-playbook process regardless of which
    # Python actually runs it, so prefer that when present.
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python3')
         if lookup('env', 'VIRTUAL_ENV')
         else ansible_playbook_python }}
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ ansible_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      api_timeout: "{{ proxmox_api_timeout }}"
  block:
    - name: "{{ tmpl_key }}: create the template VM shell"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        name: "{{ tmpl_key }}"
        ostype: "{{ tmpl.ostype }}"
        agent: true
        cores: 2
        memory: 2048
        cpu: "{{ proxmox_vm_cpu }}"
        net:
          net0: "virtio,bridge={{ proxmox_mgmt_bridge }}"
        scsihw: virtio-scsi-pci
        serial:
          serial0: socket
        vga: serial0
        state: present

    - name: "{{ tmpl_key }}: import the downloaded image as the boot disk"
      community.proxmox.proxmox_disk:
        vmid: "{{ tmpl.vmid }}"
        disk: scsi0
        storage: "{{ proxmox_storage_pool }}"
        # A raw absolute path here only works for a real interactive root
        # session -- an API token (even root@pam's) hits "Only root can pass
        # arbitrary filesystem paths", so this uses the storage-relative
        # <STORAGE>:import/<FILE> form instead (PVE 9.x+), which resolves to
        # the same place staged_image (resolved above) downloaded it to.
        import_from: "{{ proxmox_storage_pool }}:import/{{ tmpl_key }}.qcow2"
        create: regular
        state: present

    - name: "{{ tmpl_key }}: attach the cloud-init drive and finalize boot config"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        ide:
          ide2: "{{ proxmox_storage_pool }}:cloudinit"
        boot: "order=scsi0"
        bootdisk: scsi0
        state: present
        # state: present on an already-existing vmid (the shell created two
        # tasks up) is otherwise a silent no-op -- the module only applies
        # new values when update is true, and update itself still blocks
        # net/ide/sata/scsi/virtio changes (ide2 here) unless update_unsafe
        # is also true. See the identical comment in legacy_create_vm.yml.
        update: true
        update_unsafe: true

    - name: "{{ tmpl_key }}: convert to a template"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        template: true
        state: present
        # Same as above -- vmid already exists by this point, so state:
        # present needs update: true or this never actually converts it.
        update: true

- name: "{{ tmpl_key }}: remove the staged image file"
  ansible.builtin.file:
    path: "{{ staged_image }}"
    state: absent
  become: true
