---
# Builds one missing template (tmpl_key/tmpl), included from
# build_templates.yml. staged_image lives on the Proxmox node itself
# (this file runs on the node's normal SSH connection, same as every
# other role in this repo); every API task below is delegated to
# localhost.
- name: "{{ tmpl_key }}: ensure the image staging dir exists"
  ansible.builtin.file:
    path: "{{ proxmox_image_staging_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: "{{ tmpl_key }}: download the cloud image to this node"
  ansible.builtin.get_url:
    url: "{{ tmpl.image_url }}"
    dest: "{{ proxmox_image_staging_dir }}/{{ tmpl_key }}.qcow2"
    mode: "0644"
  become: true

- name: "{{ tmpl_key }}: ensure virt-customize is available on this node"
  ansible.builtin.package:
    name: libguestfs-tools
    state: present
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

# Bakes proxmox_template_bake_packages[tmpl.os_family] into the staged
# qcow2 in place, before it's imported as the template's boot disk --
# see that var's own comment for why these packages specifically and
# not others. --network is required: without it the appliance
# virt-customize boots to run --install in has no route out to the
# guest's package mirrors, so every --install would just fail offline.
# --install runs each package as its own linked operation in the order
# given on the command line (one appliance boot covers all of them), and
# the final --run-command clears the guest's package-manager cache so a
# clone's first real install isn't confused by a stale index the way the
# upstream Rocky cloud image already is on its own, unbaked dnf cache
# (see common/tasks/acl.yml's "stale dnf cache" task/comment -- same
# underlying dnf behaviour, unrelated cause).
- name: "{{ tmpl_key }}: bake baseline packages into the staged image"
  ansible.builtin.command:
    # Each package gets its own --install so virt-customize's "run
    # operations in the order given" behaviour is what decides ordering
    # (epel-release before node-exporter), not comma-list parsing inside
    # a single --install. bake_install_args is built below as a real
    # Ansible/Jinja list (namespace + for-loop), so this argv is a plain
    # list expression throughout -- no shell involved.
    argv: >-
      {{
        ['virt-customize', '-a', proxmox_image_staging_dir ~ '/' ~ tmpl_key ~ '.qcow2', '--network']
        + bake_install_args
        + ['--run-command', 'dnf clean all' if tmpl.os_family == 'RedHat' else 'apt-get clean']
      }}
  vars:
    bake_install_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pkg in proxmox_template_bake_packages[tmpl.os_family] -%}
        {%- set ns.args = ns.args + ['--install', pkg] -%}
      {%- endfor -%}
      {{ ns.args }}
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

- delegate_to: localhost
  become: false
  vars:
    # ansible_playbook_python is the interpreter actually running
    # ansible-playbook itself, which isn't necessarily the one with
    # proxmoxer installed -- e.g. a system-wide ansible-core install
    # alongside a per-operator venv used only for extra libraries.
    # $VIRTUAL_ENV (set by the shell on `source venv/bin/activate`) is
    # inherited by the ansible-playbook process regardless of which
    # Python actually runs it, so prefer that when present.
    ansible_python_interpreter: >-
      {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python3')
         if lookup('env', 'VIRTUAL_ENV')
         else ansible_playbook_python }}
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ ansible_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      api_timeout: "{{ proxmox_api_timeout }}"
  block:
    - name: "{{ tmpl_key }}: create the template VM shell"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        name: "{{ tmpl_key }}"
        ostype: "{{ tmpl.ostype }}"
        agent: true
        cores: 2
        memory: 2048
        cpu: "{{ proxmox_vm_cpu }}"
        net:
          net0: "virtio,bridge={{ proxmox_mgmt_bridge }}"
        scsihw: virtio-scsi-pci
        serial:
          serial0: socket
        vga: serial0
        state: present

    - name: "{{ tmpl_key }}: import the downloaded image as the boot disk"
      community.proxmox.proxmox_disk:
        vmid: "{{ tmpl.vmid }}"
        disk: scsi0
        storage: "{{ proxmox_storage_pool }}"
        # A raw absolute path here only works for a real interactive root
        # session -- an API token (even root@pam's) hits "Only root can pass
        # arbitrary filesystem paths", so this uses the storage-relative
        # <STORAGE>:import/<FILE> form instead (PVE 9.x+), which resolves to
        # the same place proxmox_image_staging_dir downloaded the image to.
        import_from: "{{ proxmox_storage_pool }}:import/{{ tmpl_key }}.qcow2"
        create: regular
        state: present

    - name: "{{ tmpl_key }}: attach the cloud-init drive and finalize boot config"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        ide:
          ide2: "{{ proxmox_storage_pool }}:cloudinit"
        boot: "order=scsi0"
        bootdisk: scsi0
        state: present
        # state: present on an already-existing vmid (the shell created two
        # tasks up) is otherwise a silent no-op -- the module only applies
        # new values when update is true, and update itself still blocks
        # net/ide/sata/scsi/virtio changes (ide2 here) unless update_unsafe
        # is also true. See the identical comment in legacy_create_vm.yml.
        update: true
        update_unsafe: true

    - name: "{{ tmpl_key }}: convert to a template"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        template: true
        state: present
        # Same as above -- vmid already exists by this point, so state:
        # present needs update: true or this never actually converts it.
        update: true

- name: "{{ tmpl_key }}: remove the staged image file"
  ansible.builtin.file:
    path: "{{ proxmox_image_staging_dir }}/{{ tmpl_key }}.qcow2"
    state: absent
  become: true
