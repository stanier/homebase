---
- name: "{{ tmpl_key }}: resolve the staged image's path on this node's storage"
  ansible.builtin.command:
    argv: ["pvesm", "path", "{{ proxmox_storage_pool }}:import/{{ tmpl_key }}.qcow2"]
  register: staged_image_path
  changed_when: false
  become: true

- name: "{{ tmpl_key }}: remember the staged image path"
  ansible.builtin.set_fact:
    staged_image: "{{ staged_image_path.stdout | trim }}"

- name: "{{ tmpl_key }}: ensure the image staging dir exists"
  ansible.builtin.file:
    path: "{{ staged_image | dirname }}"
    state: directory
    mode: "0755"
  become: true

- name: "{{ tmpl_key }}: download the cloud image to this node"
  ansible.builtin.get_url:
    url: "{{ tmpl.image_url }}"
    dest: "{{ staged_image }}"
    mode: "0644"
  become: true

- name: "{{ tmpl_key }}: ensure virt-customize is available on this node"
  ansible.builtin.package:
    name: libguestfs-tools
    state: present
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

- name: "{{ tmpl_key }}: bake baseline packages into the staged image"
  ansible.builtin.command:
    argv: >-
      {{
        ['virt-customize', '-a', staged_image, '--network']
        + (bake_redhat_args + bake_kernel_cmdline_args if tmpl.os_family == 'RedHat' else [])
        + ['--update']
        + bake_install_args
        + bake_uninstall_args
        + (bake_crashkernel_args + ['--delete', '/etc/kernel/cmdline'] if tmpl.os_family == 'RedHat' else [])
        + bake_disable_args
        + bake_mask_args
        + ['--run-command', 'dnf clean all' if tmpl.os_family == 'RedHat' else 'apt-get clean']
        + (bake_selinux_args if tmpl.os_family == 'RedHat' else [])
      }}
  vars:
    bake_install_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pkg in proxmox_template_bake_packages[tmpl.os_family] -%}
        {%- set ns.args = ns.args + ['--install', pkg] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_uninstall_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for pkg in proxmox_template_bake_uninstall_packages.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--uninstall', pkg] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_kernel_cmdline_args:
      - --run-command
      - >-
        eval "$(grubby --info=DEFAULT | grep -E '^(args|root)=')"
        && test -n "$root"
        && echo "root=$root $args" | sed -E 's/ ?crashkernel=[^ ]*//' > /etc/kernel/cmdline
    bake_crashkernel_args:
      - --run-command
      - "sed -i -E 's/ ?crashkernel=[^ \"]*//' /etc/default/grub"
      - --run-command
      - grubby --update-kernel=ALL --remove-args=crashkernel
    bake_disable_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for svc in proxmox_template_bake_disabled_services.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--run-command', 'systemctl disable ' ~ svc] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_mask_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for svc in proxmox_template_bake_masked_services.get(tmpl.os_family, []) -%}
        {%- set ns.args = ns.args + ['--run-command', 'systemctl mask ' ~ svc] -%}
      {%- endfor -%}
      {{ ns.args }}
    bake_selinux_args:
      - --truncate
      - /etc/machine-id
      - --run-command
      - >-
        setfiles -F -T 0 -e /proc -e /sys -e /dev -e /run -e /boot/efi
        /etc/selinux/targeted/contexts/files/file_contexts /
      - --delete
      - /.autorelabel
      - --no-selinux-relabel
    bake_redhat_args: >-
      {%- set ns = namespace(args=[]) -%}
      {%- for line in proxmox_template_dnf_conf_lines -%}
        {%- set ns.args = ns.args + ['--append-line', '/etc/dnf/dnf.conf:' ~ line] -%}
      {%- endfor -%}
      {{ ns.args }}
  become: true
  when: tmpl.os_family in proxmox_template_bake_packages

- delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ proxmox_controller_python }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ ansible_host }}"
      api_user: "{{ proxmox_api_user }}"
      api_token_id: "{{ proxmox_api_token_id }}"
      api_token_secret: "{{ proxmox_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      api_timeout: "{{ proxmox_api_timeout }}"
  block:
    - name: "{{ tmpl_key }}: create the template VM shell"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        name: "{{ tmpl_key }}"
        ostype: "{{ tmpl.ostype }}"
        agent: true
        cores: 2
        memory: 2048
        cpu: "{{ proxmox_vm_cpu }}"
        net:
          net0: "virtio,bridge={{ proxmox_mgmt_bridge }}"
        scsihw: virtio-scsi-pci
        serial:
          serial0: socket
        vga: serial0
        state: present

    - name: "{{ tmpl_key }}: import the downloaded image as the boot disk"
      community.proxmox.proxmox_disk:
        vmid: "{{ tmpl.vmid }}"
        disk: scsi0
        storage: "{{ proxmox_storage_pool }}"
        import_from: "{{ proxmox_storage_pool }}:import/{{ tmpl_key }}.qcow2"
        create: regular
        state: present

    - name: "{{ tmpl_key }}: attach the cloud-init drive and finalize boot config"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        ide:
          ide2: "{{ proxmox_storage_pool }}:cloudinit"
        boot: "order=scsi0"
        bootdisk: scsi0
        state: present
        update: true
        update_unsafe: true

    - name: "{{ tmpl_key }}: convert to a template"
      community.proxmox.proxmox_kvm:
        node: "{{ inventory_hostname }}"
        vmid: "{{ tmpl.vmid }}"
        template: true
        state: present
        update: true

- name: "{{ tmpl_key }}: remove the staged image file"
  ansible.builtin.file:
    path: "{{ staged_image }}"
    state: absent
  become: true
