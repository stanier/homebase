---
- name: Assert this host's Proxmox node/vmid are known
  ansible.builtin.assert:
    that:
      - proxmox_vm.node is defined
      - proxmox_vmid is defined
    fail_msg: >-
      {{ inventory_hostname }} has no proxmox_vm.node/proxmox_vmid set --
      nothing to reboot through Proxmox.

- name: Look up this VM's Proxmox node's own API credentials
  ansible.builtin.set_fact:
    proxmox_vm_api_host: "{{ hostvars[proxmox_vm.node].ansible_host }}"
    proxmox_vm_api_user: "{{ hostvars[proxmox_vm.node].proxmox_api_user }}"
    proxmox_vm_api_token_id: "{{ hostvars[proxmox_vm.node].proxmox_api_token_id }}"
    proxmox_vm_api_token_secret: "{{ hostvars[proxmox_vm.node].proxmox_api_token_secret }}"

- name: "Reboot {{ inventory_hostname }} ({{ proxmox_vmid }}) through Proxmox"
  community.proxmox.proxmox_kvm:
    node: "{{ proxmox_vm.node }}"
    vmid: "{{ proxmox_vmid }}"
    state: restarted
    timeout: "{{ proxmox_reboot_timeout }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_vm_api_host }}"
      api_user: "{{ proxmox_vm_api_user }}"
      api_token_id: "{{ proxmox_vm_api_token_id }}"
      api_token_secret: "{{ proxmox_vm_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      api_timeout: "{{ proxmox_api_timeout }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ proxmox_controller_python }}"

- name: Wait for {{ inventory_hostname }} to come back over SSH
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: "{{ proxmox_reboot_timeout }}"
