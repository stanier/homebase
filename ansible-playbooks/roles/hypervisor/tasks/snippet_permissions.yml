---
# Lets proxmox-tofu (a separate repo -- see its README) write the
# mgmt-NIC-rename cloud-init snippet into proxmox_snippet_dir over plain
# SSH as proxmox_snippet_write_user. Unlike legacy_create_vm.yml's equivalent
# task in this repo, Tofu's own SSH file transfer has no become/sudo
# step of its own -- it just runs `tee` as whatever user it connects as
# -- so that user needs real filesystem write access instead. Self-heals
# on every run, same pattern as repo_hygiene.yml; included as a
# pre_task from plays/system/update.yml for any host in [proxmox].
- name: Ensure the snippet-writers group exists
  ansible.builtin.group:
    name: "{{ proxmox_snippet_group }}"
    state: present

- name: Add proxmox_snippet_write_user to the snippet-writers group
  ansible.builtin.user:
    name: "{{ proxmox_snippet_write_user }}"
    groups: "{{ proxmox_snippet_group }}"
    append: true

- name: Group-own the snippets directory, setgid so new files inherit the group
  ansible.builtin.file:
    path: "{{ proxmox_snippet_dir }}"
    state: directory
    group: "{{ proxmox_snippet_group }}"
    mode: "2775"

# Only files, deliberately -- proxmox_snippet_dir shouldn't have
# subdirectories, but if it ever does, its own mode above already covers
# it and this shouldn't touch anything inside them.
- name: Find snippet files written before this group existed
  ansible.builtin.find:
    paths: "{{ proxmox_snippet_dir }}"
    patterns: "*.yaml"
  register: proxmox_existing_snippets

- name: Group-own and group-write existing snippet files too
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: "{{ proxmox_snippet_group }}"
    mode: "g+w"
  loop: "{{ proxmox_existing_snippets.files }}"
  loop_control:
    label: "{{ item.path }}"
