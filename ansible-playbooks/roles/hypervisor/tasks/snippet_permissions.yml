---
- name: Ensure the snippet-writers group exists
  ansible.builtin.group:
    name: "{{ proxmox_snippet_group }}"
    state: present

- name: Add proxmox_snippet_write_user to the snippet-writers group
  ansible.builtin.user:
    name: "{{ proxmox_snippet_write_user }}"
    groups: "{{ proxmox_snippet_group }}"
    append: true

- name: Group-own the snippets directory, setgid so new files inherit the group
  ansible.builtin.file:
    path: "{{ proxmox_snippet_dir }}"
    state: directory
    group: "{{ proxmox_snippet_group }}"
    mode: "2775"

- name: Find snippet files written before this group existed
  ansible.builtin.find:
    paths: "{{ proxmox_snippet_dir }}"
    patterns: "*.yaml"
  register: proxmox_existing_snippets

- name: Group-own and group-write existing snippet files too
  ansible.builtin.file:
    path: "{{ item.path }}"
    group: "{{ proxmox_snippet_group }}"
    mode: "g+w"
  loop: "{{ proxmox_existing_snippets.files }}"
  loop_control:
    label: "{{ item.path }}"
