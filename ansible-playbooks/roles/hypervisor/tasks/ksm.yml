---
# Kernel Samepage Merging -- every VM here is a full clone of the same
# rocky-10 template, so their kernels, systemd, sssd, the baked agents
# and the shared container base layers are byte-identical pages KSM can
# collapse into one copy on the host. Proxmox ships ksmtuned already, but
# its stock KSM_THRES_COEF=20 only starts merging once free host memory
# drops below 20%, i.e. after the node is already under pressure. Raising
# it lets merging run in the background while there's still headroom.
# Included as a pre_task from plays/system/update.yml for any host in
# [proxmox], same self-healing pattern as repo_hygiene.yml.
#
# Check the effect with: cat /sys/kernel/mm/ksm/pages_sharing (x4 KiB
# = memory saved).
- name: Ensure ksmtuned is installed
  ansible.builtin.apt:
    name: ksmtuned
    state: present

- name: Set the free-memory threshold ksmtuned starts merging below
  ansible.builtin.lineinfile:
    path: /etc/ksmtuned.conf
    regexp: '^#?\s*KSM_THRES_COEF='
    line: "KSM_THRES_COEF={{ proxmox_ksm_thres_coef }}"
  register: proxmox_ksmtuned_conf

- name: Ensure ksmtuned is running and enabled
  ansible.builtin.systemd_service:
    name: ksmtuned
    state: "{{ 'restarted' if proxmox_ksmtuned_conf is changed else 'started' }}"
    enabled: true
