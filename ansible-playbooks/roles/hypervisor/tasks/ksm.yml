---
- name: Ensure ksmtuned is installed
  ansible.builtin.apt:
    name: ksmtuned
    state: present

- name: Set the free-memory threshold ksmtuned starts merging below
  ansible.builtin.lineinfile:
    path: /etc/ksmtuned.conf
    regexp: '^#?\s*KSM_THRES_COEF='
    line: "KSM_THRES_COEF={{ proxmox_ksm_thres_coef }}"
  register: proxmox_ksmtuned_conf

- name: Ensure ksmtuned is running and enabled
  ansible.builtin.systemd_service:
    name: ksmtuned
    state: "{{ 'restarted' if proxmox_ksmtuned_conf is changed else 'started' }}"
    enabled: true
