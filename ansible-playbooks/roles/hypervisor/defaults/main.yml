---
# Proxmox API auth. user/token_id are just identifiers, shared across
# nodes as long as the same user/token-id names were created on each --
# but they live in each environment's group_vars/proxmox.yml, not as
# role defaults here: legacy_create_vm.yml looks them up via
# hostvars[proxmox_vm.node] for a node that may not itself be a target
# of the current run (e.g. -l <newhost> only), and role defaults are
# only merged into a host's vars when that host actually runs the role
# in this play -- group_vars apply to every inventory host regardless.
# proxmox_api_token_secret is the actual secret and has no default here
# -- turkey/homelab aren't clustered, so each has its own independent
# user/token database, and it's wired to the vault per-node instead, in
# host_vars/turkey.yml / host_vars/homelab.yml (see docs/VAULT.md).

# Self-signed cert on the Proxmox web UI/API in this homelab -- flip to
# true if that ever changes (a real cert, or a CA these control-node
# calls trust).
proxmox_api_validate_certs: false

# HTTP client read timeout for every community.proxmox.* call in this
# role (proxmoxer's own default is 5s, way too tight for calls like
# "Configure cloud-init networking and login" that trigger a real config
# write on the Proxmox node -- under load, e.g. testrun.sh hitting one
# node with 6 hosts' worth of these calls back to back, pveproxy can
# take longer than 5s just to respond, which read_timeout can't tell
# apart from the node actually being stuck. This is only the per-HTTP-
# call timeout, unrelated to the "timeout:" param some tasks also set
# (e.g. the clone task's timeout: 300), which is proxmox_kvm's own
# separate long-poll wait for a Proxmox task (clone/stop/etc) to finish.
proxmox_api_timeout: 30

# Where each build_templates.yml run stages a cloud image on the Proxmox
# node's own filesystem before importing it as a disk -- get_url needs a
# real filesystem path, there's no API call that pulls an arbitrary URL
# straight into storage. Cleaned up after each template build.
#
# Must be proxmox_storage_pool's own "import" content directory: the
# actual disk-import task (build_template.yml) references the staged
# file via the storage-relative "<STORAGE>:import/<FILE>" volid, not
# this raw path, since a raw absolute path in import_from is rejected
# for anything but a real interactive root session (API tokens included,
# even root@pam's). This default matches the "local" storage's import
# dir; repoint it if proxmox_storage_pool is ever something else.
proxmox_image_staging_dir: /var/lib/vz/import

# proxmox_templates (the key -> {image_url, vmid, ostype, ssh_user} map
# consumed by build_templates.yml/build_template.yml/legacy_create_vm.yml) has
# no default here -- it lives per-environment in
# inventory/<env>/group_vars/proxmox/templates.yml, so testzone and
# dangerzone can each maintain their own set of golden templates.

# Display type legacy_create_vm.yml sets on every new clone -- deliberately
# different from the template's own vga: serial0 (build_template.yml),
# since a template only needs a serial console to build cleanly, but a
# real VM's first boot is exactly when you want a normal display to
# debug against (cloud-init hangs, network misconfig, etc.) rather than
# relying on a serial getty the guest may not have brought up yet.
# "std" works with Proxmox's own noVNC console with no extra guest
# drivers; switch to "qxl" (+ SPICE) if you want copy/paste and better
# resolution and don't mind installing spice-vdagent in the guest.
# Override per-VM via proxmox_vm.vga in host_vars if a specific host
# needs something else.
proxmox_vm_vga: std

# Emulated CPU type for both golden templates (build_template.yml) and
# every clone of them (legacy_create_vm.yml) -- kvm64 (Proxmox/QEMU's own
# default) is a lowest-common-denominator baseline missing instruction
# sets modern guest kernels/software increasingly assume are there,
# which is what's causing the breakage. "host" passes the hypervisor's
# actual CPU straight through instead, at the cost of losing
# migration/live-migration compatibility across nodes with different
# CPUs -- turkey/homelab aren't clustered, so that tradeoff doesn't
# apply here. Override per-VM via proxmox_vm.cpu in host_vars if a
# specific host ever needs a different type.
proxmox_vm_cpu: host

# Bridges new VM NICs attach to -- net0 is the app-serving VLAN (a new
# VM's primary NIC, carrying app_ip, same as every existing host -- see
# the comment at the top of inventory/*/hosts.ini), net1 the management
# VLAN (management_ip; roles/management_network takes over on that
# interface once the host is up). Left unset on purpose: set these to
# the real bridge names once they're finalized on turkey/homelab.
proxmox_mgmt_bridge: ""
proxmox_app_bridge: ""

# Also not yet finalized -- the app VLAN's real default gateway (there's
# no equivalent placeholder needed for the management VLAN: that one's
# gateway is management_gateway, already set per-host in host_vars for
# roles/management_network's split routing).
proxmox_app_gateway: ""

# Assumed /24s for both VLANs, matching every subnet already in use
# across inventory/*/hosts.ini (192.0.2.0/24, 198.51.100.0/24,
# 203.0.113.0/24). Override if a new VM ever lands on a differently
# sized subnet.
proxmox_network_prefix: 24

proxmox_vm_nameservers: []

# OUI-style prefix (first 3 octets) stamped onto every new VM's
# management NIC (net1) MAC address at clone time -- see legacy_create_vm.yml's
# management_mac. Must be in the locally-administered range (2nd hex
# digit of the first octet one of 2/6/A/E) so it can never collide with
# a real vendor OUI; "02:00:00" is the obvious/simplest such prefix.
#
# Left blank by default: net1 then keeps Proxmox's own randomly
# generated MAC, and legacy_create_vm.yml skips pinning the MAC and skips the
# rename-to-management_interface snippet below entirely -- the guest
# keeps whatever name predictable-naming assigns it (e.g. Rocky's
# ens19), same as today. Set to a real prefix (as a group_vars/vm.yml
# value, not here) once you want new VMs' mgmt NIC actually renamed to
# management_interface.
management_mac_prefix: ""

# Storage id the mgmt-NIC-rename cloud-init snippet is uploaded to (see
# legacy_create_vm.yml) -- must be a directory-backed storage with the
# "Snippets" content type enabled (Datacenter -> Storage -> <id> -> Edit
# -> Content; a one-time manual change per node, not every storage type
# supports arbitrary files -- e.g. LVM-thin/ZFS zvols can't). "local" is
# the always-present per-node directory storage and the safest default;
# override only if snippets need to live somewhere else in this cluster.
proxmox_snippet_storage: local

# cloud-init's initial user -- must be the operator's own personal
# account, not the fleet-wide ansible_user (== "automation", see
# group_vars/all/vars.yml): the automation account doesn't exist until
# plays/system/onboarding.yml creates it
# (roles/common/tasks/provision_automation_user.yml), so onboarding
# itself has to reach the host as the operator first, same as
# ./onboard --ask-become-pass does today. Left unset on purpose, like
# proxmox_mgmt_bridge/proxmox_app_bridge above -- set the real value in
# group_vars/proxmox/main.yml (same account as that group's
# ansible_user, in practice).
proxmox_vm_ciuser: ""

# Matches the private key onboard already uses
# (-e ansible_ssh_private_key_file=~/.ssh/id_ed25519).
proxmox_vm_ssh_public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

# roles/hypervisor/tasks/snippet_permissions.yml -- who the proxmox-tofu
# OpenTofu module (a separate repo, not this one) SSHes into
# turkey/homelab as when it uploads the mgmt-NIC-rename snippet --
# proxmox-tofu/scripts/proxmox-nodes.py reads this same account off
# [proxmox:vars]' ansible_user in inventory, so providers.tf's
# ssh.username never hardcodes it either. Deliberately *not* the
# fleet-wide ansible_user (== "automation", group_vars/all/vars.yml) --
# Tofu's SSH file transfer has no become/sudo equivalent, unlike
# legacy_create_vm.yml's own snippet-upload task, so whoever it connects
# as needs direct write access to proxmox_snippet_dir; passwordless
# sudo (which "automation" already has) doesn't help it the way it
# helps Ansible. Left unset on purpose, like proxmox_vm_ciuser above --
# set the real value in group_vars/proxmox/main.yml.
proxmox_snippet_write_user: ""

# Directory-owning group this task grants proxmox_snippet_write_user
# membership in, then group-owns proxmox_snippet_dir with (setgid, so
# files written after this task runs keep inheriting it). "pve" or
# "www-data" would already exist and might seem like a shortcut, but
# both carry broader Proxmox-internal meaning on this system than "can
# write cloud-init snippets" -- a dedicated group keeps the grant
# legible and easy to revoke on its own.
proxmox_snippet_group: pvesnippets

# Same path legacy_create_vm.yml's own "Render and upload the mgmt-NIC-rename
# cloud-init snippet" task writes to.
proxmox_snippet_dir: /var/lib/vz/snippets

# roles/hypervisor/tasks/snapshot.yml -- prunes older ansible-taken
# snapshots once there are more than this many, so plays/system/update.yml's
# automatic pre-update snapshot doesn't grow storage usage unbounded.
# 0 would keep every snapshot forever.
proxmox_snapshot_retention: 5

# Distinct per run so retention counts actual snapshots taken, not
# overwrites of the same name. Override with -e for a one-off snapshot
# with a more meaningful name (see plays/vm/snapshot_vm.yml).
proxmox_snapshot_name: "ansible-{{ ansible_date_time.iso8601_basic_short }}"
