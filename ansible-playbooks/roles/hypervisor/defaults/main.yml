---
proxmox_api_validate_certs: false

proxmox_controller_python: >-
  {{ (lookup('env', 'VIRTUAL_ENV') ~ '/bin/python3')
     if lookup('env', 'VIRTUAL_ENV')
     else ansible_playbook_python }}

proxmox_api_timeout: 30

proxmox_template_bake_packages:
  RedHat:
    - epel-release
    - git
    - acl
    - audit
    - node-exporter
    - qemu-guest-agent
    - firewalld
    - postfix
  Debian:
    - git
    - acl
    - auditd
    - prometheus-node-exporter
    - qemu-guest-agent
    - firewalld

proxmox_template_bake_disabled_services:
  RedHat:
    - firewalld
    - dnf-makecache.timer
  Debian:
    - firewalld

proxmox_template_bake_uninstall_packages:
  RedHat:
    - kdump-utils
    - udisks2
    - cockpit*
  Debian: []

proxmox_template_bake_masked_services:
  RedHat:
    - fwupd.service
    - fwupd-refresh.timer
  Debian: []

proxmox_template_dnf_conf_lines:
  - max_parallel_downloads=10

proxmox_template_rebuild: false

proxmox_vm_cpu: host

proxmox_mgmt_bridge: ""

proxmox_snippet_write_user: ""
proxmox_snippet_group: pvesnippets
proxmox_snippet_dir: /var/lib/vz/snippets

proxmox_snapshot_retention: 5
proxmox_snapshot_name: "ansible-{{ ansible_facts['date_time'].iso8601_basic_short }}"

proxmox_ksm_thres_coef: 50

proxmox_reboot_timeout: 300
