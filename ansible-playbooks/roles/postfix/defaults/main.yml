---
# Master switch -- off by default (same idiom as roles/firewall's
# firewall_enabled), so this role can be wired into every host's play
# now without doing anything until a host_vars/group_vars turns it on.
postfix_enabled: false

# The central mail delivery host's Postfix (smtpd) that this satellite
# relays everything through, and the port it listens for relayed mail
# on. Required once postfix_enabled is true -- left empty so a host that
# turns this on without setting it fails loudly (relayhost = [] is
# invalid) instead of silently defaulting somewhere unintended.
postfix_relay_host: ""
postfix_relay_port: 25

# Domain this host's outbound mail claims to be from (mydomain/myorigin
# in main.cf, and the right-hand side of unqualified local addresses
# like root@<myhostname>).
postfix_mydomain: "{{ base_domain }}"

# Where root's (and by extension cron/systemd/unattended-upgrades')
# local mail alias forwards to, e.g. keyton@{{ base_domain }} once that
# mailbox exists on the delivery host. Left empty to skip managing
# /etc/aliases' root: line entirely until a real address is set --
# mail addressed to root still gets accepted and queued locally
# otherwise, it just never leaves the host.
postfix_root_alias_recipient: ""
