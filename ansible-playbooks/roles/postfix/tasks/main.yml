---
# Preseed Debian's debconf questions so the install doesn't prompt.
- name: Preseed postfix debconf selections
  ansible.builtin.debconf:
    name: postfix
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: postfix/main_mailer_type, vtype: select, value: "Satellite system" }
    - { question: postfix/mailname, vtype: string, value: "{{ postfix_mydomain }}" }
    - { question: postfix/relayhost, vtype: string, value: "{{ postfix_relay_host }}" }
  when:
    - postfix_enabled
    - ansible_facts['os_family'] == "Debian"

- name: Install postfix
  ansible.builtin.package:
    name: postfix
    state: present
  when: postfix_enabled

- name: Configure postfix as a satellite relaying through the delivery host
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: restart postfix
  when: postfix_enabled

- name: Point root's local mail alias at a real recipient
  # Always written, even empty, so alias_maps always has a table to open.
  ansible.builtin.template:
    src: root_alias.j2
    dest: /etc/postfix/root_alias
    owner: root
    group: root
    mode: "0644"
  notify: restart postfix
  when: postfix_enabled

- name: Ensure postfix is enabled and running
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true
  when: postfix_enabled
