---
- name: Fail fast if management networking is misconfigured
  ansible.builtin.assert:
    that:
      - management_interface | length > 0
      - management_ip | length > 0
    fail_msg: >-
      management_network_enabled is true but management_interface/
      management_ip aren't set -- define both in host_vars before
      applying this role.
  when: management_network_enabled

- name: Refresh network facts (the mgmt interface may have just come up)
  ansible.builtin.setup:
    gather_subset: network
  when: management_network_enabled

- name: Refuse to restrict sshd unless management_ip is actually live
  ansible.builtin.assert:
    that:
      - management_ip in ansible_facts['all_ipv4_addresses']
    fail_msg: >-
      management_ip ({{ management_ip }}) isn't assigned to any
      interface on this host yet. Bring up the management VLAN
      interface first -- pointing sshd's ListenAddress at an address
      that doesn't exist would lock out SSH entirely.
  when: management_network_enabled and ssh_bind_management_only

- name: Assign the management interface to its own firewalld zone
  ansible.posix.firewalld:
    zone: "{{ management_firewalld_zone }}"
    interface: "{{ management_interface }}"
    permanent: true
    immediate: true
    state: enabled
  when: management_network_enabled and firewall_enabled | default(false)

- name: Drop the stock cockpit service from the management zone
  ansible.posix.firewalld:
    zone: "{{ management_firewalld_zone }}"
    service: cockpit
    permanent: true
    immediate: true
    state: disabled
  when: management_network_enabled and firewall_enabled | default(false)

- name: "Bind sshd to the management VLAN instead of the 0.0.0.0/:: wildcard"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-management-vlan.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/management_network). The
      # main sshd_config has no ListenAddress of its own, so this is the
      # only one sshd sees -- it replaces the built-in 0.0.0.0/::
      # wildcard rather than adding to it.
      ListenAddress {{ management_ip }}
  when: management_network_enabled and ssh_bind_management_only
  notify: restart sshd
