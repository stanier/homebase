# --- firewalld zone (additive; see management_firewalld_zone comment) --

- name: Assign the management interface to its own firewalld zone
  ansible.posix.firewalld:
    zone: "{{ management_firewalld_zone }}"
    interface: "{{ management_interface }}"
    permanent: true
    immediate: true
    state: enabled
  when: management_network_enabled and firewall_enabled | default(false)

# --- sshd ---------------------------------------------------------------

- name: "Bind sshd to the management VLAN instead of the 0.0.0.0/:: wildcard"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-management-vlan.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/management_network). The
      # main sshd_config has no ListenAddress of its own, so this is the
      # only one sshd sees -- it replaces the built-in 0.0.0.0/::
      # wildcard rather than adding to it.
      ListenAddress {{ management_ip }}
  when: management_network_enabled and ssh_bind_management_only
  notify: restart sshd
