# The effective rp_filter value the kernel applies to an interface is
# the MAX of conf.all.rp_filter and conf.<iface>.rp_filter (see
# Documentation/networking/ip-sysctl.rst) -- and since 2 (loose) sorts
# higher than 1 (strict), that max is numeric, not "whichever is
# stricter". So it's important this only ever touches
# management_interface, never conf.all: bumping conf.all to 2 would
# raise the effective value on every other interface on the host too
# (ens18/VLAN 80 included), since max(2, anything <= 2) is always 2.
# Leaving conf.all at RHEL/Rocky's strict default (1) is what keeps
# ens18 strict while only the mgmt interface goes loose.
