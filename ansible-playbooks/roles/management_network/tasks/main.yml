---
- name: Fail fast if management networking is misconfigured
  ansible.builtin.assert:
    that:
      - management_interface | length > 0
      - management_ip | length > 0
    fail_msg: >-
      management_network_enabled is true but management_interface/
      management_ip aren't set -- define both in host_vars before
      applying this role.
  when: management_network_enabled

- name: Refresh network facts (the mgmt interface may have just come up)
  ansible.builtin.setup:
    gather_subset: network
  when: management_network_enabled

- name: Refuse to restrict sshd unless management_ip is actually live
  ansible.builtin.assert:
    that:
      - management_ip in ansible_facts['all_ipv4_addresses']
    fail_msg: >-
      management_ip ({{ management_ip }}) isn't assigned to any
      interface on this host yet. Bring up the management VLAN
      interface first -- pointing sshd's ListenAddress at an address
      that doesn't exist would lock out SSH entirely.
  when: management_network_enabled and ssh_bind_management_only

- name: Refuse to restrict sshd when split routing for management_gateway isn't active
  ansible.builtin.assert:
    that:
      - management_gateway | default('') | length == 0
    fail_msg: >-
      management_gateway is set, but the split-routing tasks below that
      keep SSH replies going out via that gateway are currently
      commented out. Binding sshd exclusively to management_ip without
      them means a reply to a connection that arrived via
      management_gateway can leave out the wrong interface and get
      dropped or blocked upstream as spoofed -- a plausible SSH
      lockout. Re-enable the split-routing tasks above before turning
      on ssh_bind_management_only for a host with a gateway, or leave
      ssh_bind_management_only false for it.
  when: management_network_enabled and ssh_bind_management_only

# --- split routing -----------------------------------------------------
# A host with a management network is multi-homed: it keeps its normal
# default route out the LAN interface, but a connection that arrives on
# management_ip (e.g. SSH from a workstation reachable via the router's
# VLAN 42/80 punch-through) needs its reply to leave via
# management_gateway/management_interface too, not via the main default
# route -- otherwise a packet carrying source address management_ip
# leaves out the wrong interface, and either never finds its way back
# or gets dropped upstream as spoofed.
#
# This is a source-address-scoped rule (`ip rule add from
# management_ip`), not a change to the main table's default route --
# the management interface never becomes a general egress path for the
# host's own outbound traffic (updates, DNS, etc. keep using the normal
# LAN gateway); it only ever answers back out the way a connection
# came in. Skipped entirely when management_gateway is blank (isolated
# L2 segment, no gateway needed).

