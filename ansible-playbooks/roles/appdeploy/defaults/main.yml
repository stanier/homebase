---
appdeploy_ci_public_key: ""
appdeploy_caddy_route_hostname: app-proxy
appdeploy_domain_suffix: "apps.{{ base_domain }}"
appdeploy_base_port: 20000

# gitea_ci_integration.yml is skipped while gitea_ci_api_token is empty.
appdeploy_ci_private_key: ""
gitea_ci_api_token: ""
# Gitea's published port directly, not the HTTPS vhost, so the caller
# needn't trust the internal root CA.
appdeploy_gitea_api_base: "http://{{ hostvars['gitea'].ansible_host }}:3000/api/v1"

# Per-app env files, written to appdeploy/env/<app>.env, which deploy.sh
# passes to the app's quadlet as EnvironmentFile=. Takes the form
# {app: {VAR: value}}, with values normally from vault. Removing an app
# from this var leaves its file in place.
appdeploy_app_env: {}
