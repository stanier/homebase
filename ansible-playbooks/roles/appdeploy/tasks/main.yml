---
# "Poor man's Dokku": the CI key's forced command is deploy.sh, which
# builds and runs whatever app a Gitea Actions workflow sends, then asks
# the Caddy host (roles/appdeploy_caddy) to route it through a second,
# equally narrow forced-command key. See docs/GITEA_ACTIONS.md.

- name: Ensure appdeploy directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"
  loop:
    - "{{ containers_home }}/appdeploy"
    - "{{ containers_home }}/appdeploy/state"
    - "{{ containers_home }}/appdeploy/build"
    - "{{ containers_home }}/.config/containers/systemd"

- name: Ensure the per-app env file directory exists
  ansible.builtin.file:
    path: "{{ containers_home }}/appdeploy/env"
    state: directory
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0700"

- name: Ensure ports.tsv exists
  ansible.builtin.copy:
    dest: "{{ containers_home }}/appdeploy/state/ports.tsv"
    content: ""
    force: false
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0640"

- name: Install deploy.sh
  ansible.builtin.template:
    src: deploy.sh.j2
    dest: "{{ containers_home }}/appdeploy/deploy.sh"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0750"

- name: Write per-app env files
  ansible.builtin.copy:
    dest: "{{ containers_home }}/appdeploy/env/{{ item.key }}.env"
    content: |
      {% for name, value in item.value.items() %}
      {{ name }}={{ value }}
      {% endfor %}
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
    mode: "0600"
  loop: "{{ appdeploy_app_env | dict2items }}"
  no_log: true
  register: appdeploy_env_files

- name: Check which of those apps are already deployed
  ansible.builtin.stat:
    path: "{{ containers_home }}/.config/containers/systemd/{{ item }}.container"
  loop: "{{ appdeploy_app_env.keys() | list }}"
  register: appdeploy_env_quadlet_stats

# deploy.sh only adds EnvironmentFile= when the env file exists at deploy
# time, so an app deployed before its env file needs the line added here.
- name: Point already-deployed apps' quadlets at their env files
  ansible.builtin.lineinfile:
    path: "{{ item.stat.path }}"
    line: "EnvironmentFile=%h/appdeploy/env/{{ item.item }}.env"
    insertafter: "^Label=appdeploy="
  loop: "{{ appdeploy_env_quadlet_stats.results | selectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item }}"
  register: appdeploy_env_quadlets

- name: Look up the containers user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers_user }}"
  when: appdeploy_app_env | length > 0

- name: Restart already-deployed apps whose env changed
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    scope: user
    state: restarted
    daemon_reload: true
  become_user: "{{ containers_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[containers_user][1] }}"
  loop: >-
    {{ ((appdeploy_env_files.results | selectattr('changed') | map(attribute='item.key') | list)
        + (appdeploy_env_quadlets.results | selectattr('changed') | map(attribute='item.item') | list))
       | unique
       | intersect(appdeploy_env_quadlet_stats.results | selectattr('stat.exists') | map(attribute='item') | list) }}

- name: Restrict the CI deploy key to running deploy.sh only
  ansible.posix.authorized_key:
    user: "{{ containers_user }}"
    key: "{{ appdeploy_ci_public_key }}"
    # No unquoted whitespace: sshd ends the options list at the first
    # one and silently breaks the entry.
    key_options: "command=\"{{ containers_home }}/appdeploy/deploy.sh\",no-agent-forwarding,no-X11-forwarding,no-port-forwarding,no-pty"
    state: present
  when: appdeploy_ci_public_key | length > 0

- name: Determine the management-VLAN jump host, if any, for the Caddy host
  # The Caddy host's management IP is only reachable via the bastion in
  # ansible_ssh_common_args' ProxyCommand, and ssh-keyscan has no -o, so
  # run it on the bastion instead. (app_ip isn't routed to the
  # controller at all.)
  ansible.builtin.set_fact:
    appdeploy_caddy_jump_host: >-
      {{ hostvars[appdeploy_caddy_route_hostname].ansible_ssh_common_args
         | default('')
         | regex_search('[A-Za-z0-9_.-]+@[0-9.]+') | default('', true) }}

- name: Scan SSH host key for the Caddy host
  ansible.builtin.command: >-
    {{ 'ssh -o StrictHostKeyChecking=accept-new ' + appdeploy_caddy_jump_host
       if appdeploy_caddy_jump_host | length > 0 else '' }}
    ssh-keyscan -t ed25519 {{ hostvars[appdeploy_caddy_route_hostname].ansible_host }}
  register: appdeploy_caddy_host_hostkey
  changed_when: false
  delegate_to: localhost
  become: false

- name: Trust the Caddy host's key for containers user
  ansible.builtin.known_hosts:
    name: "{{ hostvars[appdeploy_caddy_route_hostname].ansible_host }}"
    key: "{{ appdeploy_caddy_host_hostkey.stdout }}"
    path: "{{ containers_home }}/.ssh/known_hosts"
    state: present
  become_user: "{{ containers_user }}"

- name: Generate SSH keypair for reaching the Caddy host's caddy-route.sh
  community.crypto.openssh_keypair:
    path: "{{ containers_home }}/.ssh/caddy_route_ed25519"
    type: ed25519
    mode: "0600"
    owner: "{{ containers_user }}"
    group: "{{ containers_user }}"
  become_user: "{{ containers_user }}"

- name: Read back the generated caddy-route public key
  ansible.builtin.slurp:
    src: "{{ containers_home }}/.ssh/caddy_route_ed25519.pub"
  register: appdeploy_caddy_route_pubkey_raw

- name: Expose the caddy-route public key for the Caddy host's play to pick up
  ansible.builtin.set_fact:
    appdeploy_caddy_generated_pubkey: "{{ appdeploy_caddy_route_pubkey_raw.content | b64decode | trim }}"

- name: Push CI deploy key and DEPLOY_HOST into Gitea's user-level Actions config
  ansible.builtin.include_tasks: gitea_ci_integration.yml
  when: gitea_ci_api_token | length > 0
  tags: appdeploy_gitea_ci
