---
# Sets SSH_PRIVATE_KEY and DEPLOY_HOST as user-level Actions secret and
# variable, which Gitea inherits into every repo that user owns -- a new
# app repo only needs Actions enabled. gitea_ci_api_token needs write
# access to those; see docs/VAULT.md.

- name: Push the appdeploy CI private key into Gitea as a user-level Actions secret
  # Secrets are write-only, so this always PUTs. Base64 because a raw key
  # loses its trailing newline in a secrets field; ci-actions'
  # deploy-to-apphost decodes it.
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/secrets/SSH_PRIVATE_KEY"
    method: PUT
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      data: "{{ appdeploy_ci_private_key | b64encode }}"
    status_code: [200, 201, 204]
  delegate_to: gitea
  no_log: true
  run_once: true

- name: Check whether Gitea already has a DEPLOY_HOST user-level Actions variable
  # Gitea's variables API splits create (POST) from update (PUT).
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: GET
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    status_code: [200, 404]
  delegate_to: gitea
  register: appdeploy_gitea_deploy_host_variable
  run_once: true

- name: Create the DEPLOY_HOST user-level Actions variable
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: POST
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      # Management address: app_ip isn't reachable from the runner.
      value: "{{ hostvars['app-host'].ansible_host }}"
    status_code: [201]
  delegate_to: gitea
  run_once: true
  when: appdeploy_gitea_deploy_host_variable.status == 404

- name: Update the DEPLOY_HOST user-level Actions variable
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: PUT
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      value: "{{ hostvars['app-host'].ansible_host }}"
    status_code: [200, 204]
  delegate_to: gitea
  run_once: true
  when: appdeploy_gitea_deploy_host_variable.status == 200
