---
# Same trimming build_template.yml bakes into new templates
# (proxmox_template_bake_uninstall_packages /
# proxmox_template_bake_disabled_services, and the crashkernel= strip),
# enforced here for hosts cloned before that existed. See those vars in
# roles/hypervisor/defaults/main.yml for why each one goes.
#
# The crashkernel= reservation is only actually released at the next
# boot -- this doesn't reboot anything itself; plays/vm/reboot_vms.yml
# or the next update.yml reboot picks it up.
- block:
  - name: Remove kdump, udisks2 and cockpit
    ansible.builtin.dnf:
      name:
        - kdump-utils
        - udisks2
        - cockpit*
      state: absent
      autoremove: false

  # fwupd itself has to stay -- on EL10 it Provides dbxtool, which the
  # dnf-protected shim-x64 requires.
  - name: Mask fwupd and its refresh timer
    ansible.builtin.systemd_service:
      name: "{{ item }}"
      masked: true
      state: stopped
    loop:
      - fwupd-refresh.timer
      - fwupd.service

  - name: Strip crashkernel= from the default kernel command line
    ansible.builtin.replace:
      path: /etc/default/grub
      regexp: ' ?crashkernel=[^ "]*'
      replace: ''

  - name: Read installed kernels' boot entries
    ansible.builtin.command: grubby --info=ALL
    register: trim_grubby_info
    changed_when: false

  - name: Strip crashkernel= from installed kernels' boot entries
    ansible.builtin.command: grubby --update-kernel=ALL --remove-args=crashkernel
    when: "'crashkernel=' in trim_grubby_info.stdout"

  - name: Disable dnf-makecache.timer
    ansible.builtin.systemd_service:
      name: dnf-makecache.timer
      enabled: false
      state: stopped
  when: ansible_facts['os_family'] == 'RedHat'
  tags:
    - packages
