---
- name: Ensure system hostname matches inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname ~ '.' ~ base_domain if common_hostname_fqdn else inventory_hostname }}"
  vars:
    common_hostname_fqdn: "{{ freeipa_enabled | default(false) or freeipa_client_enabled | default(false) }}"

- name: Ensure the FQDN resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ app_ip | default(ansible_facts['default_ipv4'].address) | regex_escape }}\\s"
    line: "{{ app_ip | default(ansible_facts['default_ipv4'].address) }} {{ inventory_hostname }}.{{ base_domain }} {{ inventory_hostname }}"
    state: present
  when: freeipa_enabled | default(false) or freeipa_client_enabled | default(false)
