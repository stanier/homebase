---
# proxmox-tofu never sets nameservers for any VM (nameservers = [] in
# every module block there), so every VM has only ever gotten DNS from
# whatever its app-network DHCP happened to hand out -- confirmed via
# nmcli on app-proxy: 127.0.0.1/192.168.1.1/1.1.1.1, none of which know
# about {{ base_domain }}. That's why Caddy (Network=host, so it uses
# this VM's own OS resolver directly, not a container-scoped one) can
# obtain certs for gitea/grafana/etc. by IP but fails resolving a
# brand-new *.apps.{{ base_domain }} hostname for its internal ACME
# request. AdGuardHome (dnsguard) already forwards non-internal
# queries upstream itself (see its own containerapps_secret_files
# config), so pointing here at just that one server covers both
# internal and external resolution correctly.
#
# dnsguard is the *only* resolver every VM gets -- deliberately no
# public fallback. glibc moves on to the next nameserver whenever the
# first one times out or SERVFAILs (not only when it's down), and a
# public resolver answers NXDOMAIN for every {{ base_domain }} name, so
# a single dropped query turned into a hard "Name or service not known"
# (hit by ipa-client-install on dnsguard itself mid-enrollment).
#
# The one exception is the [dns] group's own bootstrap: dns/dnsguard
# need *some* resolver for dnf/EPEL/image pulls before AdGuardHome
# exists to answer, so until dnsguard's port 53 is actually reachable
# they get Quad9 alone (not alongside dnsguard). plays/apps/dns.yml
# re-runs this file once AdGuardHome is up, which drops the bootstrap
# resolver again. Every other VM refuses to proceed until then instead
# -- deploy the [dns] group first (plays/apps/dns.yml).
- name: Check whether dnsguard's AdGuardHome is answering yet
  ansible.builtin.wait_for:
    host: "{{ hostvars['dnsguard'].app_ip }}"
    port: 53
    timeout: 5
  register: internal_dns_dnsguard_probe
  failed_when: false
  when: "'vm' in group_names"

- name: Require dnsguard to be up before pointing a non-DNS host at it
  ansible.builtin.assert:
    that: internal_dns_dnsguard_probe is not failed
    fail_msg: >-
      dnsguard ({{ hostvars['dnsguard'].app_ip }}:53) isn't answering,
      and only the [dns] group gets a bootstrap resolver. Deploy DNS
      first: ansible-playbook -i inventory/<env> plays/apps/dns.yml
  when:
    - "'vm' in group_names"
    - "'dns' not in group_names"

- name: Point the app-network interface's DNS at the internal resolver
  # "cloud-init eth0" matches cloud-init's deterministic per-interface
  # connection naming and this fleet's convention that eth0 is always
  # the app-network NIC (see group_vars/vm.yml's management_interface:
  # eth1 for the other one) -- not parameterized further since nothing
  # else in this repo needs to reference the app interface by name yet.
  community.general.nmcli:
    conn_name: "cloud-init eth0"
    type: ethernet
    dns4: "{{ ['9.9.9.9'] if internal_dns_dnsguard_probe is failed else [hostvars['dnsguard'].app_ip] }}"
    dns4_ignore_auto: true
    state: present
  when: "'vm' in group_names"
  notify: reapply app interface connection

- name: Check for the management interface's connection profile
  ansible.builtin.command:
    argv: [nmcli, -g, NAME, connection, show, "cloud-init {{ management_interface }}"]
  register: internal_dns_mgmt_conn
  changed_when: false
  failed_when: false
  when:
    - "'vm' in group_names"
    - management_interface | default('') | length > 0

- name: Stop the management interface's DHCP from adding its own resolvers
  # The management VLAN's DHCP hands out 192.168.1.1/1.1.1.1/8.8.8.8,
  # which land in resolv.conf right after dnsguard -- the same public
  # fallback problem as above, just arriving from the other NIC.
  # Only modifies an existing profile (checked above); never creates
  # one, since nmcli's state: present would otherwise invent a new
  # connection if cloud-init ever named it differently.
  community.general.nmcli:
    conn_name: "cloud-init {{ management_interface }}"
    type: ethernet
    dns4_ignore_auto: true
    state: present
  when:
    - "'vm' in group_names"
    - internal_dns_mgmt_conn.rc | default(1) == 0
  notify: reapply management interface connection
