---
- name: Install rsyslog
  ansible.builtin.package:
    name: rsyslog
    state: present
  when: syslog_forward_enabled

- name: Ensure systemd-journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: syslog_forward_enabled

- name: Stop journald forwarding to the local syslog socket
  # Avoids double-delivery: imjournal (below) reads the journal directly,
  # so if journald *also* forwards to /dev/log, rsyslog's imuxsock module
  # picks up a second copy of every message and we'd ship duplicates to
  # the remote server.
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-no-syslog-forward.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      ForwardToSyslog=no
  notify: restart systemd-journald
  when: syslog_forward_enabled

- name: Configure remote forwarding to the central syslog server
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/60-remote-forward.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/logging). Reads straight from
      # the systemd journal, so this covers host system logs and podman's
      # container logs alike -- podman's default log-driver writes
      # container stdout/stderr into the same journal, journald doesn't
      # separate them out by user.
      module(load="imjournal" StateFile="imjournal.state" ratelimit.interval="0")

      action(type="omfwd"
             target="{{ syslog_server_host }}"
             port="{{ syslog_server_port }}"
             protocol="{{ syslog_forward_protocol }}"
             action.resumeRetryCount="-1"
             queue.type="linkedList"
             queue.filename="fwd_to_syslog")
  notify: restart rsyslog
  when: syslog_forward_enabled

- name: Remove remote forwarding config when disabled
  ansible.builtin.file:
    path: /etc/rsyslog.d/60-remote-forward.conf
    state: absent
  notify: restart rsyslog
  when: not syslog_forward_enabled

- name: Restore journald forwarding to the local syslog socket when disabled
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/60-no-syslog-forward.conf
    state: absent
  notify: restart systemd-journald
  when: not syslog_forward_enabled

- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: true
  when: syslog_forward_enabled
