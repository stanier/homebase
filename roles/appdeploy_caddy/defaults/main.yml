---
# Public half of apphost's containers_user -> here key, generated by
# roles/appdeploy and passed in by plays/apps/appdeploy.yml via hostvars --
# not meant to be set directly in host_vars.
appdeploy_caddy_public_key: ""

# Must match roles/appdeploy's appdeploy_domain_suffix on whichever
# host(s) route through here.
appdeploy_domain_suffix: "apps.{{ base_domain }}"
