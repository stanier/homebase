---
- name: Ensure firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present
  when: firewall_enabled

- name: Ensure firewalld is running and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  when: firewall_enabled

- name: Allow SSH
  ansible.posix.firewalld:
    service: ssh
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when: firewall_enabled and firewall_allow_ssh

- name: Allow configured ports open to any source
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_rules | rejectattr('from', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"
  when: firewall_enabled

- name: Allow configured ports scoped to a specific source
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 source address={{ item.from }} port port={{ item.port }} protocol={{ item.proto | default('tcp') }} accept"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_rules | selectattr('from', 'defined') | list }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }} from {{ item.from }}"
  when: firewall_enabled
