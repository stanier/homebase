---
# Domain this host is the final destination for (Postfix
# virtual_mailbox_domains) and the CN/SAN on Dovecot's generated TLS cert
# is "mail.{{ mail_server_domain }}".
mail_server_domain: "{{ base_domain }}"

# Subnets allowed to relay through this host's Postfix unauthenticated
# (mynetworks) -- every roles/postfix satellite lives in one of these,
# see inventory/dangerzone/host_vars/metrics1.yml for the same CIDRs
# used as firewall "from" scopes elsewhere. 192.168.100.0/24 is the
# Proxmox hosts' own app subnet (turkey/homelab) -- reaching mail1 from
# there depends on inter-VLAN routing being allowed between it and
# 192.168.104.0/24, which hasn't been verified.
mail_server_relay_networks:
  - 127.0.0.0/8
  - 192.168.100.0/24
  - 192.168.104.0/24

# Virtual mailboxes to provision, e.g.:
#   mail_server_virtual_mailboxes:
#     - name: keyton
#       password_hash: "{{ vault_mail_keyton_password_hash }}"
# password_hash must be a SHA512-CRYPT hash (`mkpasswd -m sha-512` or
# `python3 -c "import crypt; print(crypt.crypt('...', crypt.mksalt(crypt.METHOD_SHA512)))"`)
# -- same convention as roles/common's root_password_hash. Each becomes
# <name>@{{ mail_server_domain }} in both Postfix's virtual_mailbox_maps
# and Dovecot's passdb.
mail_server_virtual_mailboxes: []

# Where Dovecot's TLS cert is signed from -- the same offline
# intermediate CA container-sandbox's Caddy already holds
# (caddy_intermediate_cert/caddy_intermediate_key in
# inventory/<env>/group_vars/all/vars.yml), so anything that already
# trusts the fleet's root CA (every host, via
# roles/common/tasks/trust_root_ca.yml) trusts this cert too without a
# separate ACME flow.
mail_server_ca_cert: "{{ caddy_intermediate_cert }}"
mail_server_ca_key: "{{ caddy_intermediate_key }}"
mail_server_cert_validity_days: 825

# Every /srv/dovecot/* path below is bind-mounted into dovecot.container
# with podman's :z SELinux relabel flag, which needs to lsetxattr() the
# source -- root-owned paths fail that ("operation not permitted") when
# podman runs rootless as this user, not root. Same default as
# roles/podman_exporter's own (independently redefined rather than
# depended on via meta, same reasoning as that role: this one shouldn't
# assume roles/containerapps/boxship has already run in an earlier play
# within the same overall playbook run).
containers_user: containers
