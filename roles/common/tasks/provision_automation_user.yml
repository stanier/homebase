---
- name: Create automation service account
  ansible.builtin.user:
    name: automation
    system: false
    create_home: true
    shell: /bin/bash
    password_lock: true
    state: present

- name: Authorize the dedicated automation SSH key
  ansible.posix.authorized_key:
    user: automation
    state: present
    key: "{{ lookup('file', 'automation_ed25519.pub') }}"

- name: Grant automation passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/automation
    content: "automation ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
