---
# Proxmox VE ships pointed at the paywalled enterprise repo by default --
# apt update 401s on it without a paid subscription, which breaks
# plays/system/update.yml on turkey/homelab specifically. Points them at the
# free no-subscription repo instead. Included as a pre_task from
# plays/system/update.yml for any host in [proxmox], so this self-heals on
# every routine update run rather than needing a one-off fix.
- name: Disable the paywalled Proxmox enterprise repo (no subscription on this homelab)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent

- name: Enable the free Proxmox no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-playbooks (roles/hypervisor). Replaces the
      # default pve-enterprise repo, which needs a paid support
      # subscription this homelab doesn't have.
      deb http://download.proxmox.com/debian/pve {{ ansible_facts['distribution_release'] }} pve-no-subscription
  register: proxmox_repo_file

- name: Refresh apt cache after changing Proxmox repos
  ansible.builtin.apt:
    update_cache: true
  when: proxmox_repo_file is changed
