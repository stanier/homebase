---
# Snapshots inventory_hostname via the Proxmox API, given proxmox_node/
# proxmox_vmid in this host's own host_vars. Included two ways:
#   - automatically, as a pre_task in plays/system/update.yml, for any host
#     that has proxmox_node/proxmox_vmid set
#   - on demand via plays/vm/snapshot_vm.yml --tags snapshot -l <host>
#
# Both run this against the host's own SSH connection (not
# connection: local, unlike legacy_create_vm.yml) since the host already
# exists and is reachable -- only the actual proxmox_snap call is
# delegated to localhost, an API call.
- name: Assert this host's Proxmox node/vmid are known
  ansible.builtin.assert:
    that:
      - proxmox_node is defined
      - proxmox_vmid is defined
    fail_msg: >-
      {{ inventory_hostname }} has no proxmox_node/proxmox_vmid set in
      its host_vars -- add both before snapshotting it. See
      docs/Typical_Procedure.md.

- name: Look up this VM's Proxmox node's own API credentials
  ansible.builtin.set_fact:
    proxmox_vm_api_host: "{{ hostvars[proxmox_node].ansible_host }}"
    proxmox_vm_api_user: "{{ hostvars[proxmox_node].proxmox_api_user }}"
    proxmox_vm_api_token_id: "{{ hostvars[proxmox_node].proxmox_api_token_id }}"
    proxmox_vm_api_token_secret: "{{ hostvars[proxmox_node].proxmox_api_token_secret }}"

- name: "Snapshot {{ inventory_hostname }} ({{ proxmox_snapshot_name }})"
  community.proxmox.proxmox_snap:
    vmid: "{{ proxmox_vmid }}"
    snapname: "{{ proxmox_snapshot_name }}"
    description: "Taken by ansible-playbooks (roles/hypervisor)"
    retention: "{{ proxmox_snapshot_retention }}"
    state: present
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_vm_api_host }}"
      api_user: "{{ proxmox_vm_api_user }}"
      api_token_id: "{{ proxmox_vm_api_token_id }}"
      api_token_secret: "{{ proxmox_vm_api_token_secret }}"
      validate_certs: "{{ proxmox_api_validate_certs }}"
      api_timeout: "{{ proxmox_api_timeout }}"
  delegate_to: localhost
  become: false
