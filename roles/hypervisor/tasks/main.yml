---
# All gated behind "never" (see plays/system/onboarding.yml for the same
# pattern) -- this role does several unrelated, not-everyday things, and
# none should fire just because a play happens to include this role.
# Pass the matching --tags explicitly (or, for
# snapshot/repo_hygiene/snippet_permissions, include_role with
# tasks_from -- see plays/system/update.yml's pre_tasks).
- import_tasks: build_templates.yml
  tags: [never, templates]

- import_tasks: legacy_create_vm.yml
  tags: [never, legacy_create_vm]

- import_tasks: legacy_delete_vm.yml
  tags: [never, legacy_delete_vm]

- import_tasks: snapshot.yml
  tags: [never, snapshot]

- import_tasks: repo_hygiene.yml
  tags: [never, repo_hygiene]

- import_tasks: snippet_permissions.yml
  tags: [never, snippet_permissions]
