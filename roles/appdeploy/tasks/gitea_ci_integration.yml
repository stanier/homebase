---
# Pushes the shared appdeploy CI keypair and app-host's address into
# Gitea's *user*-level Actions secrets/variables (not per-repo, not
# per-org) -- every app repo lives under the single 'keyton' namespace
# (see containerapps_repo), and Gitea inherits user-level Actions
# secrets/variables into every repo that user owns, so a new app repo's
# workflow can reference ${{ secrets.SSH_PRIVATE_KEY }} and
# ${{ vars.DEPLOY_HOST }} with no manual per-repo Gitea configuration --
# only "enable Actions" on that repo remains a manual, one-time toggle.
#
# Delegated to the gitea host itself and called over plain HTTP against
# its own published port -- see appdeploy_gitea_api_base's own comment.
# gitea_ci_api_token needs write access to user-level Actions
# secrets/variables; see docs/VAULT.md for how to create one.

- name: Push the appdeploy CI private key into Gitea as a user-level Actions secret
  # Secrets are write-only in Gitea's API (no GET to diff against), and
  # this single PUT creates-or-updates -- so this always reports changed,
  # same as any other secret push in this fleet (see containerapps'
  # gitea-runner .env writes, which have the same property).
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/secrets/SSH_PRIVATE_KEY"
    method: PUT
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      data: "{{ appdeploy_ci_private_key }}"
    status_code: [200, 201, 204]
  delegate_to: gitea
  no_log: true
  run_once: true

- name: Check whether Gitea already has a DEPLOY_HOST user-level Actions variable
  # Unlike secrets, variables are readable, and Gitea's variables API
  # splits create (POST) from update (PUT) instead of one create-or-update
  # call -- so this decides which of those two to use below.
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: GET
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    status_code: [200, 404]
  delegate_to: gitea
  register: appdeploy_gitea_deploy_host_variable
  run_once: true

- name: Create the DEPLOY_HOST user-level Actions variable
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: POST
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      value: "{{ hostvars['app-host'].ansible_host }}"
    status_code: [201]
  delegate_to: gitea
  run_once: true
  when: appdeploy_gitea_deploy_host_variable.status == 404

- name: Update the DEPLOY_HOST user-level Actions variable
  ansible.builtin.uri:
    url: "{{ appdeploy_gitea_api_base }}/user/actions/variables/DEPLOY_HOST"
    method: PUT
    headers:
      Authorization: "token {{ gitea_ci_api_token }}"
    body_format: json
    body:
      value: "{{ hostvars['app-host'].ansible_host }}"
    status_code: [200, 204]
  delegate_to: gitea
  run_once: true
  when: appdeploy_gitea_deploy_host_variable.status == 200
