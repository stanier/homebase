# Managed by container-files/wazuh. Copied verbatim from
# wazuh/wazuh-indexer:4.14.7's stock opensearch.yml (extracted via
# `podman run --rm --entrypoint cat wazuh/wazuh-indexer:4.14.7
# .../config/opensearch.yml`), with three changes:
#   - node.name: wazuh.indexer -> wazuh-indexer (our Quadlet network
#     alias -- avoids a dot in a name other Wazuh services will refer
#     to by hostname).
#   - plugins.security.nodes_dn: demo.indexer -> wazuh-indexer, so it
#     matches the CN the TLS bootstrap (docs/VAULT.md's Wazuh section)
#     should mint the indexer's own cert with.
#   - plugins.security.allow_default_init_securityindex: true (added
#     below). The image's entrypoint has its securityadmin auto-run
#     commented out, so without this a fresh data volume never gets a
#     .opendistro_security index and the dashboard sits at "server is
#     not ready yet". It only seeds an *absent* index: later edits to
#     internal_users.yml still need a manual securityadmin run (see
#     ansible-playbooks/docs/VAULT.md's Wazuh section).
# admin_dn stays "CN=admin,..." -- that's the CN wazuh-certs-tool mints
# for the admin cert (admin.pem/admin-key.pem) by convention; keep it
# matching whatever the actual cert bootstrap produces.
network.host: "0.0.0.0"
node.name: "wazuh-indexer"
cluster.name: "wazuh-cluster"
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer
discovery.type: single-node
compatibility.override_main_response_version: true
plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/indexer.pem
plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/indexer-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/indexer.pem
plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/indexer-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/root-ca.pem
plugins.security.ssl.http.enabled: true
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.transport.resolve_hostname: false
plugins.security.ssl.http.enabled_ciphers:
  - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
  - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
  - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
  - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
plugins.security.ssl.http.enabled_protocols:
  - "TLSv1.2"
plugins.security.authcz.admin_dn:
- "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.allow_default_init_securityindex: true
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.enable_snapshot_restore_privilege: true
plugins.security.nodes_dn:
- "CN=wazuh-indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.restapi.roles_enabled:
- "all_access"
- "security_rest_api_access"
plugins.security.system_indices.enabled: true
plugins.security.system_indices.indices: [".opendistro-alerting-config", ".opendistro-alerting-alert*", ".opendistro-anomaly-results*", ".opendistro-anomaly-detector*", ".opendistro-anomaly-checkpoints", ".opendistro-anomaly-detection-state", ".opendistro-reports-*", ".opendistro-notifications-*", ".opendistro-notebooks", ".opensearch-observability", ".opendistro-asynchronous-search-response*", ".replication-metadata-store"]