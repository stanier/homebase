# Broker for container-files/meshcore. Every client authenticates, and
# acl decides what each may read and write. The ACL's comments explain
# the topic layout; the gateway repo's README has the full reference.
listener 1883
allow_anonymous false
# Private copies made by mosquitto.container's start command.
password_file /tmp/passwd
acl_file /tmp/acl

# Nothing worth persisting: the gateway republishes its retained
# status/device/channels topics every time it (re)connects.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
