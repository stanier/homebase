# Global default changed from the image's own "*" to loopback-only --
# the base image ships an *unnamed* default LMTP listener under
# `service lmtp` (confirmed via `doveconf -n`) that inherits whatever
# `listen` is set to, and Dovecot only merges *named* sub-blocks across
# files; two separate unnamed `inet_listener { ... }` blocks (the base's
# own, and an attempted override here) don't merge either -- they just
# both try to bind, one wildcard and one specific, and the master
# process fails outright ("Address already in use"). There's no name to
# hook into to override it directly, so this restricts the fleet-wide
# default instead and opts imaps back into being reachable externally
# below (its own explicit address = * undoes this for that one listener
# only). roles/mail_server's native Postfix is LMTP's only intended
# client anyway, reached over 127.0.0.1 since this container runs with
# Network=host (see dovecot.container).
listen = 127.0.0.1

# IMAP: implicit TLS (993) for any real mail client on the app subnet
# (see 10-ssl.conf for the cert) -- plus a second, plaintext listener
# bound to 127.0.0.1 only, for Roundcube. Roundcube's container has no
# reason to trust our internal CA (that trust is only installed on the
# host OS by roles/common/tasks/trust_root_ca.yml, never baked into
# container images), and this loopback hop never leaves the host either
# way, so plaintext here isn't a real exposure -- it's not reachable off
# 127.0.0.1 at all, unlike imaps below which binds every interface.
#
# "imap"/"imaps" happen to be the base image's own names for these two
# listeners too, so these do cleanly override (not duplicate) its
# defaults -- unlike LMTP above, this one isn't a name mismatch.
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 143
    ssl = no
  }
  inet_listener imaps {
    # Explicit address = * -- otherwise this would inherit the new
    # loopback-only `listen` default above along with everything else,
    # and stop being reachable from the app subnet at all.
    address = *
    port = 993
    ssl = yes
  }
}
