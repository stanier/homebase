protocols = imap lmtp

mail_location = maildir:/srv/mail/%d/%n
mail_uid = 5000
mail_gid = 5000
# A range of exactly one uid/gid -- mail_uid/mail_gid above is a single
# fixed value, not a range, but first_valid_uid must not exceed
# last_valid_uid (confirmed live: "first_valid_uid can't be larger than
# last_valid_uid" -- its default isn't treated as "unlimited" here the
# way 0 usually is elsewhere in Dovecot).
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
