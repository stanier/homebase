# Virtual mailboxes (passwd-file) plus FreeIPA users (ldap) -- passdbs
# are tried in order, first success wins, so this is additive: the
# existing virtual-mailbox model below is untouched, and any FreeIPA
# uid can now also log in as <uid>@{{ base_domain }} without a
# per-mailbox entry ever being provisioned for them. Passwords live in
# /etc/dovecot/users (passwd-file format, SHA512-CRYPT hashes),
# generated by roles/mail_server from vaulted per-mailbox password
# hashes -- see docs/VAULT.md.
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}

passdb {
  driver = ldap
  args = /etc/dovecot/conf.d/dovecot-ldap.conf.ext
}

userdb {
  # Static, numeric uid/gid rather than a named "vmail" user -- avoids
  # depending on this image shipping (or not shipping) one, and matches
  # /srv/dovecot/vmail's own ownership (see roles/mail_server).
  driver = static
  args = uid=5000 gid=5000 home=/srv/mail/%d/%n
}
