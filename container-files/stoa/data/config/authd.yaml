# authd configuration — identity broker
#
# In development this points at the local-idp container.
# In production, replace or add providers pointing at your real OIDC provider
# (Google, GitLab, Okta, etc.) and remove or comment out the local entry.

providers:
  - id: local
    issuer_url: http://local-idp:9999
    client_id: stoa
    # Secret is read from AUTHD_OAUTH_LOCAL_CLIENT_SECRET at runtime.

# How long human user session tokens remain valid.
session_ttl: 24h

# How long service account tokens remain valid (zulip-bridge, etc.).
# Rotate manually with: auth-admin authd service create <id>
service_token_ttl: 8760h  # 1 year
