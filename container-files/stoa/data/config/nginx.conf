upstream agentd {
    # Consistent URI hashing routes a given session ID to the same instance.
    # Add/remove servers here when scaling agentd horizontally.
    hash $uri consistent;
    server agentd:7777;
    keepalive 32;
}

upstream webd {
    server webd:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # Strip the proxy's own X-Forwarded headers so downstream services see
    # only what nginx sets.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # agentd — session API + WebSocket
    # All /sessions/* traffic is sticky by URI hash (session ID is in the path).
    location /sessions/ {
        proxy_pass         http://agentd;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived LLM calls can exceed default timeouts.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # agentd — other API endpoints (tools, models, agents, acp, metrics)
    location ~ ^/(tools|models|agents|acp|metrics) {
        proxy_pass         http://agentd;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # webd — Svelte SPA, auth, and proxied agentd WebSocket for browser clients
    location / {
        proxy_pass         http://webd;
        proxy_http_version 1.1;

        # webd itself proxies WebSocket connections to agentd
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }
}
