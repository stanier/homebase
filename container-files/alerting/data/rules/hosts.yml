# Host- and container-level alerts, from node-exporter and
# podman-exporter. Job names and the `instance` label (the inventory
# hostname) come from vmagent-config.yaml in host_vars/metrics1.yml --
# the same ones the Grafana dashboards key on.
groups:
  - name: hosts
    rules:
      - alert: HostDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is unreachable"
          description: "node-exporter on {{ $labels.instance }} hasn't answered a scrape for 5 minutes."

      - alert: ScrapeTargetDown
        expr: up{job!="node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} isn't answering scrapes"
          description: "vmagent has failed to scrape {{ $labels.job }} on {{ $labels.instance }} for 10 minutes."

      - alert: DiskAlmostFull
        expr: |
          100 * (1 - node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"}
                   / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"}) > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"

      - alert: DiskFillingUp
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"}[6h], 24 * 3600) < 0
          and
          node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"}
            / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|ramfs"} < 0.25
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} will fill within a day"
          description: "At the last 6 hours' rate, {{ $labels.mountpoint }} runs out of space within 24 hours."

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has under 10% memory available"

      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{job="node-exporter",state="failed"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.instance }}"

  - name: containers
    rules:
      # podman-exporter's state 2 is "running" (the Fleet overview
      # dashboard counts the same way). Quadlet containers are removed
      # when they stop, so anything listed and not running is stuck
      # starting, stopping or restarting.
      - alert: ContainerNotRunning
        expr: (podman_container_state != 2) * on (instance, id) group_left (name) podman_container_info
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} isn't running"

      # Health 1 is "unhealthy".
      - alert: ContainerUnhealthy
        expr: (podman_container_health == 1) * on (instance, id) group_left (name) podman_container_info
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} on {{ $labels.instance }} is failing its healthcheck"
